<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="일본어 6주">
<title>일본어 6주</title>
<style>
/*
Path + lesson app in Apple's visual language: system greys, SF type, inset grouped lists, sheets from the bottom.
The path (one circle per 20-minute set) is the home screen; lessons open full screen with a bottom answer bar.
*/
:root{
  color-scheme:light dark;
  --bg:light-dark(#F2F2F7,#000000);
  --card:light-dark(#FFFFFF,#1C1C1E);
  --card2:light-dark(#F2F2F7,#2C2C2E);
  --fill:light-dark(rgba(120,120,128,.12),rgba(118,118,128,.24));
  --label:light-dark(#000000,#FFFFFF);
  --label2:light-dark(rgba(60,60,67,.64),rgba(235,235,245,.64));
  --label3:light-dark(rgba(60,60,67,.32),rgba(235,235,245,.32));
  --sep:light-dark(rgba(60,60,67,.18),rgba(84,84,88,.55));
  --sep2:light-dark(rgba(60,60,67,.2),rgba(120,120,128,.45));
  --tint:light-dark(#007AFF,#0A84FF);
  --tint-soft:light-dark(rgba(0,122,255,.11),rgba(10,132,255,.22));
  --red:light-dark(#FF3B30,#FF453A);
  --green:light-dark(#34C759,#30D158);
  --green-t:light-dark(#248A3D,#30D158);
  --red-t:light-dark(#D70015,#FF6961);
  --orange:light-dark(#FF9500,#FF9F0A);
  --orange-t:light-dark(#C93400,#FFB340);
  --purple:light-dark(#AF52DE,#BF5AF2);
  --yellow-d:light-dark(#E0A100,#FFD60A);
  --bar:light-dark(rgba(249,249,249,.84),rgba(22,22,24,.8));
  --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label)}
body{font:17px/1.42 var(--font);letter-spacing:-.01em;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100dvh}
html.in-lesson body{overflow:hidden}
[lang=ja]{font-family:var(--font-ja);letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:17px;color:var(--label)}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:8px}
a{color:var(--tint);text-decoration:none}
[hidden]{display:none!important}
#nl-badge-frame{display:none!important}
.list a.row{color:inherit}

/* ---------- shell ---------- */
#app{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px;min-height:52px;background:transparent;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.topbar .mini{flex:1;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.topbar.scrolled .mini{opacity:1}
.topbar .side{width:88px;display:flex;align-items:center}
.topbar .side.r{justify-content:flex-end}
.navbtn{color:var(--tint);font-size:17px;display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 4px}
.navbtn svg{width:22px;height:22px}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin:2px 0 4px}
.subtitle{color:var(--label2);font-size:15px;margin:0 0 18px}

/* ---------- lists ---------- */
.sh{font-size:13px;color:var(--label2);margin:26px 16px 7px;font-weight:400}
.sf{font-size:13px;color:var(--label2);margin:8px 16px 0;line-height:1.4}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.row.ic+.row::before{left:58px}
button.row:active,a.row:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:1px}
.row .t b{font-weight:400}
.row .t small{color:var(--label2);font-size:15px;line-height:1.3}
.row .v{color:var(--label2);font-size:17px;white-space:nowrap}
.row.col{flex-direction:column;align-items:stretch;gap:10px}
.chev{width:9px;height:14px;color:var(--label3);flex:none}
.icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.icon svg{width:19px;height:19px}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);display:grid;place-items:center;flex:none;color:#fff}
.tick.on{background:var(--green);border-color:var(--green)}
.tick svg{width:14px;height:14px}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--fill)}
.dots i.on{background:var(--green)}

/* ---------- cards, buttons ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.hstack{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vstack{display:flex;flex-direction:column;gap:6px}
.btn{white-space:nowrap;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;width:100%;transition:transform .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.soft{background:var(--tint-soft);color:var(--tint)}
.btn.grey{background:var(--fill);color:var(--label)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px;border-radius:18px;width:auto}
.btn[disabled]{background:var(--fill);color:var(--label3);pointer-events:none}
.btn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--fill);font-size:15px;color:var(--label);white-space:nowrap}
.pill.on{background:var(--tint);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .pill{flex:none}
.muted{color:var(--label2)}
.small{font-size:15px}
.tiny{font-size:13px;color:var(--label2)}
.center{text-align:center}
.grow{flex:1}
.kbd{font-variant-numeric:tabular-nums}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.spk{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--tint);background:var(--tint-soft);flex:none}
.spk svg{width:19px;height:19px}
.spk.lg{width:54px;height:54px;border-radius:27px}
.spk.lg svg{width:27px;height:27px}
.spk.sm{width:30px;height:30px}
.spk.sm svg{width:16px;height:16px}
.spk:active{transform:scale(.94)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label)}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.field{width:100%;min-height:44px;border-radius:10px;background:var(--fill);border:0;padding:10px 12px;font-size:17px}
textarea.field{min-height:120px;resize:vertical;line-height:1.5}
.tfield{width:128px;min-height:36px;padding:4px 8px;font-size:16px;flex:none}
.field.sel{width:auto;max-width:60%;min-height:36px;padding:4px 8px;font-size:15px}
.ok-t{color:var(--green-t)}.no-t{color:var(--red-t)}.warn-t{color:var(--orange-t)}
.empty-state{padding:36px 16px;text-align:center;color:var(--label2)}
.notice{display:block;width:100%;text-align:left;position:relative;border-radius:var(--r);padding:12px 16px;background:var(--card);margin:6px 0 4px}
.notice b{display:block;font-weight:600}
.notice p{margin:2px 0 0;font-size:15px;color:var(--label2)}
.notice.info{background:var(--tint-soft)}
.notice.warn{background:color-mix(in srgb,var(--orange) 14%,var(--card));padding-right:36px}
.notice.warn .chev{position:absolute;right:16px;top:50%;margin-top:-7px}
.notice.danger{background:color-mix(in srgb,var(--red) 11%,var(--card))}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:6px 11px;border-radius:10px;margin:14px 0 0}
.chip svg{width:16px;height:16px}
.chip.ok{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-t)}
.chip.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-t)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:640px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--label3);font-size:10.5px;font-weight:500;min-height:50px;position:relative}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--tint)}
.tb-badge{position:absolute;left:50%;margin-left:6px;top:3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px;font-weight:600}

/* ---------- path ---------- */
.pathbar,.pathbar.topbar{justify-content:space-between;gap:6px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.pstat{display:inline-flex;align-items:center;gap:4px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pstat svg{width:22px;height:22px}
.pstat span{font-size:13px;font-weight:600;color:var(--label2)}
.pstat.fire{color:var(--label3)}
.pstat.fire.on{color:var(--orange)}
.pstat.fire b{color:var(--label)}
.pstat.xp svg{color:var(--yellow-d)}
.pstat.dday svg{color:var(--purple);width:20px;height:20px}
.gring{width:22px;height:22px}
.path{padding-bottom:8px}
.unit{--c:#007AFF}
.ubanner{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c);color:#fff;border-radius:16px;padding:12px 12px 12px 16px;margin:18px 0 6px;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 28%,transparent)}
.ubanner small{display:block;font-size:13px;font-weight:600;opacity:.88}
.ubanner b{display:block;font-size:19px;font-weight:700;line-height:1.25}
.ubtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:15px;font-weight:600;flex:none}
.ubtn svg{width:18px;height:18px}
.day{padding:4px 0 6px}
.dlabel{text-align:center;margin:20px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dlabel span{font-size:13px;font-weight:600;color:var(--label2);display:inline-flex;align-items:center;gap:6px}
.dlabel em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px}
.dlabel small{font-size:15px;color:var(--label)}
.day.is-today .dlabel span{color:var(--label)}
.nwrap{display:flex;flex-direction:column;align-items:center;gap:5px;margin:12px auto 0;width:max-content;transform:translateX(var(--x));position:relative}
.node{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .12s}
.node:active{transform:scale(.94)}
.node .nc{display:grid;place-items:center;position:relative;z-index:1}
.node svg{width:30px;height:30px}
.node.s-done,.node.s-current{background:var(--c);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 6px 14px color-mix(in srgb,var(--c) 32%,transparent)}
.node.s-done svg{width:32px;height:32px}
.node.s-open{background:var(--card);color:var(--c);box-shadow:inset 0 0 0 3px var(--c),0 4px 10px rgba(0,0,0,.06)}
.node.s-missed{background:var(--card);color:var(--orange);box-shadow:inset 0 0 0 3px var(--orange),0 4px 10px rgba(0,0,0,.06)}
.node.s-locked{background:var(--fill);color:var(--label3)}
.node.s-locked svg{width:26px;height:26px}
.node.s-current::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid color-mix(in srgb,var(--c) 30%,transparent);animation:halo 2s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.6}}
.ncap{font-size:12px;color:var(--label2);font-weight:500}
.nstart{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);background:var(--card);color:var(--c);font-weight:700;font-size:14px;padding:6px 12px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.14);white-space:nowrap;animation:bob 1.8s ease-in-out infinite;z-index:2}
.nstart::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--card)}
.nwrap:has(.nstart){margin-top:52px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.jcard p{margin:0;font-size:15px;color:var(--label2)}
.sshead{display:flex;gap:12px;align-items:center}
.sshead h2{margin:2px 0 0}
.sshead .tiny{margin:0}
.snode{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.snode svg{width:26px;height:26px}

/* ---------- practice / me ---------- */
.hero-due{display:flex;align-items:center;gap:14px}
.hero-due>div{flex:1;display:flex;flex-direction:column}
.hero-due b{font-size:34px;font-weight:700;line-height:1.1}
.hero-due span{font-size:15px;color:var(--label2)}
.hero-due .btn{width:auto}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.stat span svg{width:24px;height:24px}
.stat b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat small{font-size:13px;color:var(--label2)}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:128px;align-items:end}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wcol i{display:block;width:100%;max-width:28px;min-height:4px;border-radius:6px;background:var(--fill)}
.wcol i[style*="height:0%"]{height:4px!important}
.wcol:not(.now) i{background:color-mix(in srgb,var(--yellow-d) 55%,var(--fill))}
.wcol.now i{background:var(--yellow-d)}
.wv{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums;min-height:16px}
.wd{font-size:12px;color:var(--label2)}
.wcol.now .wd{color:var(--label);font-weight:700}
.cmp{display:flex;gap:8px;align-items:center}
.cj{font-size:18px}
.cj.b{font-size:20px;font-weight:600}
.ct{font-weight:600}

/* ---------- sheet & page ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.sheet h2{font-size:22px;font-weight:700;margin:6px 0 4px;line-height:1.3}
.page{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
.page.show{transform:none}
.page .inner{max-width:640px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(30,30,32,.94);color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:80;opacity:0;transition:all .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.live{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:40;background:#000;color:#fff;border-radius:22px;height:36px;padding:0 6px 0 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.live .ld{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.live .lt{font-variant-numeric:tabular-nums}
.live button{height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.18);font-size:13px}
.timer{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:8px auto 4px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .tt b{font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .tt span{color:var(--label2);font-size:15px}
.rate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rate .btn{width:100%}

/* ---------- kana chart ---------- */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc{background:var(--card);border-radius:12px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.kc:active{background:var(--fill)}
.kc .kj{font-size:30px;line-height:1.1}
.kc .kr{font-size:12px;color:var(--label2);line-height:1.2}
.kc.empty{background:transparent}
.kc .lv{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.kcard{display:inline-flex;flex-direction:column;align-items:center;padding:18px 44px 16px;border-radius:24px;background:var(--card);margin:4px auto 0}
.lesson .kcard{background:var(--card2);display:flex;width:max-content}
.kbig{font-size:min(30vw,120px);line-height:1.05}
.khg{font-size:28px;font-weight:700;margin-top:4px}
.kro{font-size:15px;color:var(--label2)}
.kmn{text-align:center;font-size:17px;margin:14px 8px 4px;line-height:1.45}
.flash{background:var(--card);border-radius:20px;min-height:260px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.flash .front{font-size:30px;font-weight:600;line-height:1.3}
.flash .ctx{font-size:15px;color:var(--label2)}
.flash .hg{font-size:16px;color:var(--label2)}
.kind{font-size:12px;font-weight:600;color:var(--tint)}

/* ---------- phrase rows ---------- */
.ph{display:flex;gap:12px;align-items:center;padding:12px 16px;position:relative}
.ph+.ph::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.ph .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.ph .jp{font-size:19px;line-height:1.35}
.ph .ko{font-size:15px;color:var(--label2)}
.ph .cas{font-size:15px;color:var(--tint)}
.ph .note{font-size:13px;color:var(--label2)}
.hg{font-size:14px;color:var(--label2)}
.hg.hid{color:transparent;background:var(--fill);border-radius:5px;width:max-content;max-width:100%;padding:0 6px;align-self:center}
.ph .hg.hid{align-self:flex-start}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--label2);margin-right:5px;vertical-align:1px;font-family:var(--font)}
.tag.staff{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange-t)}
.tag.cas{background:var(--tint-soft);color:var(--tint)}
.pair{font-size:26px;width:76px;flex:none}
.sgn{font-size:24px;width:96px;flex:none}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:8px;padding:8px 0 16px}
.bub{max-width:80%;padding:9px 14px;border-radius:19px;font-size:17px;line-height:1.38;position:relative;text-align:left}
.bub.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--tint);color:#fff;border-bottom-right-radius:6px}
.bub .tr{display:block;font-size:14px;opacity:.75;margin-top:3px;font-family:var(--font)}
.sysmsg{align-self:center;font-size:13px;color:var(--label2);text-align:center;max-width:90%}
.fb{align-self:stretch;border-radius:14px;padding:10px 14px;font-size:15px;background:var(--card)}
.fb.ok{background:color-mix(in srgb,var(--orange) 14%,var(--card))}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;min-height:40px;max-height:120px;border-radius:20px;background:var(--card);border:.5px solid var(--sep);padding:9px 14px;resize:none;font-size:17px;line-height:1.3}
.send{width:36px;height:36px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:2px}
.send svg{width:18px;height:18px}
.avatar{border-radius:50%;background:linear-gradient(160deg,#5AC8FA,#007AFF);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none}
.avatar.staff{width:40px;height:40px;background:var(--fill);color:var(--label2)}
.avatar.staff svg{width:22px;height:22px}

/* ---------- sos ---------- */
.sos{position:fixed;inset:0;z-index:90;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.sos .big{font-family:var(--font-ja);font-size:clamp(34px,9vw,64px);font-weight:700;line-height:1.35}
.sos .ko{font-size:18px;color:#555;margin-top:18px}
.sos .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:22px;background:#eee;display:grid;place-items:center}
.sos .x svg{width:22px;height:22px}

/* ================= LESSON ================= */
.lesson{position:fixed;inset:0;z-index:48;background:var(--card);display:flex;flex-direction:column;opacity:0;transform:translateY(24px);transition:opacity .22s,transform .3s cubic-bezier(.32,.72,0,1)}
.lesson.show{opacity:1;transform:none}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;max-width:640px;width:100%;margin:0 auto}
.lx{width:40px;height:40px;display:grid;place-items:center;color:var(--label2);flex:none;border-radius:20px}
.lx:active{background:var(--fill)}
.lx svg{width:24px;height:24px}
.lbar{flex:1;height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:6px;background:var(--green);transition:width .4s cubic-bezier(.32,.72,0,1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.lcombo{font-size:13px;font-weight:700;color:var(--orange-t);white-space:nowrap;min-width:0}
.lcombo:empty{display:none}
.lbody{flex:1;overflow:auto;padding:4px 16px 24px;max-width:640px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.lfoot{border-top:.5px solid var(--sep);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);transition:background .2s}
.lesson.fb-ok .lfoot{background:color-mix(in srgb,var(--green) 14%,var(--card));border-top-color:transparent}
.lesson.fb-bad .lfoot{background:color-mix(in srgb,var(--red) 11%,var(--card));border-top-color:transparent}
.lesson.fb-meh .lfoot{background:color-mix(in srgb,var(--orange) 14%,var(--card));border-top-color:transparent}
.lfb,.lbtns{max-width:608px;margin:0 auto}
.lfb{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.fic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--green);flex:none}
.fic svg{width:20px;height:20px}
.lfb.bad .fic{background:var(--red)}
.lfb.meh .fic{background:var(--orange)}
.fbt{flex:1}
.fbt b{display:block;font-size:20px;font-weight:700;color:var(--green-t);line-height:1.3}
.lfb.bad .fbt b{color:var(--red-t)}
.lfb.meh .fbt b{color:var(--orange-t)}
.fbt p{margin:3px 0 0;font-size:15px;color:var(--label);line-height:1.45}
.fbt .fans{font-size:18px;font-weight:600}
.flab{font-size:13px;font-weight:600;color:var(--label2);margin-right:8px}
.lesson.nofoot .lfoot{border-top-color:transparent;padding-top:0}
.lgo.ok{background:var(--green)}
.lgo.bad{background:var(--red)}
.lgo.meh{background:var(--orange)}
.lp{font-size:22px;font-weight:700;margin:10px 0 14px;line-height:1.3}
.lhint{text-align:center;font-size:13px;color:var(--label2);margin:10px 0 0}
.lq{display:flex;flex-direction:column;align-items:center;gap:6px;margin:4px 0 22px;text-align:center}
.qkana{font-size:min(32vw,128px);line-height:1.05}
.qsign{font-size:64px;line-height:1.2}
.qjp{font-size:28px;font-weight:600;line-height:1.35}
.qko{font-size:24px;font-weight:600;line-height:1.35}
.qsub{font-size:22px;color:var(--label2)}
.lq .hg{font-size:15px}
.qaudio{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:10px 0 4px}
.bigspk{width:96px;height:96px;border-radius:26px;background:var(--tint);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 8px 18px color-mix(in srgb,var(--tint) 30%,transparent)}
.bigspk svg{width:46px;height:46px}
.slowspk{width:58px;height:58px;border-radius:18px;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center}
.slowspk svg{width:32px;height:32px}
.bigspk:active,.slowspk:active{transform:scale(.95)}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--sep2);text-align:left;font-size:17px;line-height:1.35;transition:background .12s,border-color .12s}
.opt:active{transform:scale(.99)}
.opts.grid .opt{flex-direction:column;justify-content:center;text-align:center;min-height:92px}
.opts.grid.two .opt{min-height:110px}
.oi{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--sep2);font-size:12px;font-weight:600;color:var(--label3);display:grid;place-items:center;flex:none}
.opts.grid .oi{position:absolute;top:8px;left:8px;width:20px;height:20px;font-size:11px}
.ot{display:flex;flex-direction:column;gap:2px}
.ot b{font-size:24px;font-weight:600}
.ot small{font-size:13px;color:var(--label2)}
.okana{font-size:42px;line-height:1.1}
.okana.sm{font-size:28px}
.opt.sel{border-color:var(--tint);background:var(--tint-soft)}
.opt.sel .oi{border-color:var(--tint);color:var(--tint)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong):not(.meh){opacity:.5}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--card))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 11%,var(--card))}
.opt.meh{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--card))}
.newtag{display:inline-block;font-size:13px;font-weight:700;color:var(--purple);background:color-mix(in srgb,var(--purple) 13%,transparent);padding:4px 10px;border-radius:8px;margin:10px 0 12px}
.krow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.krow.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 4px 10px;border-radius:14px;background:var(--card2)}
.kt:active{background:var(--fill)}
.kt span{font-size:34px;line-height:1.1}
.kt b{font-size:15px;font-weight:600}
.kt small{font-size:12px;color:var(--label2)}
.mnlist{margin-top:14px}
.mnlist p{margin:5px 2px;font-size:15px;color:var(--label2)}
.mnlist span{color:var(--label);font-size:18px;margin-right:6px}
.phcard{position:relative;background:var(--card2);border-radius:20px;padding:22px 18px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pjp{font-size:30px;font-weight:600;line-height:1.35}
.pko{font-size:19px}
.pcas{display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:6px;font-size:16px;color:var(--tint);margin-top:6px}
.pcas small{font-size:13px;color:var(--label2);width:100%}
.pnote{font-size:14px;color:var(--label2);margin:6px 0 0}
.rtext{font-size:17px;line-height:1.55;margin:0 0 18px}
.rex{display:flex;flex-direction:column;gap:8px}
.rx{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px;row-gap:2px;padding:12px 14px;border-radius:14px;background:var(--card2);text-align:left}
.rx span{font-size:21px;grid-column:1}
.rx small{grid-column:1;font-size:14px;color:var(--label2);line-height:1.4}
.rx svg{width:20px;height:20px;color:var(--tint);grid-column:2;grid-row:1/3}
.tline{min-height:66px;border-bottom:1.5px solid var(--sep2);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;margin-bottom:26px;align-content:flex-start}
.tbank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{height:48px;padding:0 16px;border-radius:12px;border:1.5px solid var(--sep2);background:var(--card);font-size:20px;box-shadow:0 2px 0 var(--sep2)}
.tile:active{transform:translateY(1px)}
.tile.used{background:var(--fill);color:transparent;border-color:transparent;box-shadow:none}
.tline.right .tile{border-color:var(--green)}
.tline.wrong .tile{border-color:var(--red)}
.numin{font-size:26px;text-align:center;min-height:58px;margin-top:6px;font-variant-numeric:tabular-nums}
.drow{display:flex;gap:10px;align-items:flex-end;margin:6px 0 0}
.drow .bub{max-width:calc(100% - 52px)}
.dnarr{background:var(--card2);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--label);text-align:center;margin:6px 0 0}
.dnote{background:var(--tint-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{min-height:58px;border-radius:12px;border:1.5px solid var(--sep2);background:var(--card);padding:8px 10px;font-size:18px;box-shadow:0 2px 0 var(--sep2);transition:background .15s,border-color .15s,opacity .3s}
.match.wide .mt{font-size:15px;line-height:1.35}
.mt.sel{border-color:var(--tint);background:var(--tint-soft)}
.mt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--card));opacity:.4;box-shadow:none}
.mt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 11%,var(--card));animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.done{text-align:center;padding-top:6vh}
.done h1{font-size:30px;font-weight:800;margin:4px 0 6px}
.done .muted{margin:0 12px;font-size:16px}
.done-art{width:116px;height:116px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 22px;box-shadow:0 0 0 14px color-mix(in srgb,var(--green) 16%,transparent);animation:pop .45s cubic-bezier(.3,1.5,.6,1)}
.done-art.fail{background:var(--orange);box-shadow:0 0 0 14px color-mix(in srgb,var(--orange) 16%,transparent)}
.done-art svg{width:60px;height:60px}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.dstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:28px}
.dstats>div{border-radius:14px;border:1.5px solid var(--sep2);padding:12px 6px;display:flex;flex-direction:column;gap:2px}
.dstats span{font-size:12px;font-weight:600;color:var(--label2)}
.dstats b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.dstats>div:nth-child(1) b{color:var(--yellow-d)}
.dstats>div:nth-child(2) b{color:var(--green-t)}
.dstats>div:nth-child(3) b{color:var(--tint)}
.flame-art{color:var(--orange);animation:pop .5s cubic-bezier(.3,1.5,.6,1)}
.flame-art svg{width:110px;height:110px}
.snum{font-size:68px;font-weight:800;color:var(--orange);line-height:1;font-variant-numeric:tabular-nums}
.streak-done h1{margin-top:2px}
.wk{display:flex;justify-content:center;gap:8px;margin-top:26px}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk span{font-size:12px;color:var(--label2)}
.wk i{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:#fff}
.wk .on i{background:var(--orange)}
.wk .now span{color:var(--label);font-weight:700}
.wk svg{width:18px;height:18px}

@media (max-width:370px){
  .large{font-size:30px;line-height:36px}
  .kc .kj{font-size:26px}
  .pstat{font-size:15px}
  .pstat svg{width:19px;height:19px}
  .kt span{font-size:28px}
  .qjp,.pjp{font-size:25px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ================= CLASS STRUCTURE (v3) ================= */
.ncap em{font-style:normal;color:var(--label3);font-variant-numeric:tabular-nums;margin-right:2px}
.ltime{font-size:13px;font-weight:600;color:var(--label2);min-width:38px;text-align:right}
.stage{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:7px;margin:8px 0 0;background:var(--fill);color:var(--label2)}
.stage.s-quiz{background:color-mix(in srgb,var(--purple) 13%,transparent);color:var(--purple)}
.stage.s-listen{background:color-mix(in srgb,var(--tint) 12%,transparent);color:var(--tint)}
.stage.s-check{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green-t)}
.stage.s-book{background:color-mix(in srgb,var(--orange) 15%,transparent);color:var(--orange-t)}
.stage.s-goal{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green-t)}
.lex .stage+.newtag{margin-left:6px}
.stagecard{text-align:center;padding:12vh 8px 0}
.stagecard h2{font-size:28px;font-weight:800;margin:14px 0 8px}
.stagecard p:not(.stage){font-size:17px;color:var(--label2);line-height:1.55;margin:0}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.goals li{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.45}
.goals li svg{width:20px;height:20px;color:var(--green);flex:none;margin-top:2px}
.steps{margin:0 0 18px;padding-left:22px;font-size:17px;line-height:1.7}
.bookt{position:relative;width:150px;height:150px;margin:6px auto 8px}
.bookt svg{width:100%;height:100%}
.bookt b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:600}
.kintro{display:flex;justify-content:center;align-items:stretch;gap:12px;margin-top:4px}
.kintro .kcard{margin:0}
.kstroke{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:120px;border-radius:24px;background:var(--card2);color:var(--label)}
.kstroke small{font-size:12px;color:var(--label2)}
.strokes{width:96px;height:96px}
.strokes .guide path{stroke:var(--sep);stroke-width:.6;stroke-dasharray:2 2;fill:none}
.strokes .paths path{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.strokes .nums text{font-size:8px;fill:var(--red);font-family:var(--font);font-weight:700}
.strokes.anim .paths path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .55s ease forwards;animation-delay:calc(var(--i) * .6s)}
@keyframes draw{to{stroke-dashoffset:0}}
.strokes.mini{width:22px;height:22px;vertical-align:-6px;margin:0 4px}
.strokes.mini .nums,.strokes.mini .guide{display:none}
.strokes.mini .paths path{stroke-width:6}
.showcard{background:var(--card2);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.showcard .fans{font-size:22px;font-weight:600;margin:0}
.blank{display:inline-block;min-width:2.4em;height:1.1em;border-bottom:2.5px solid var(--tint);margin:0 4px;vertical-align:-2px}
.tin{font-size:24px;text-align:center;min-height:56px;margin-top:4px}
.kp{margin-top:6px}
.kline{min-height:52px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;font-size:26px;padding:6px 12px;margin-bottom:10px;letter-spacing:.04em;word-break:break-all}
.caret{display:inline-block;width:2px;height:28px;background:var(--tint);margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.kpad{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.kk{height:42px;border-radius:8px;background:var(--card2);font-size:19px;display:grid;place-items:center}
.kk:active{background:var(--tint-soft)}
.kk.empty{background:transparent}
.kmods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:5px}
.kmods button{height:42px;border-radius:9px;background:var(--fill);font-size:17px;font-weight:600;font-family:var(--font-ja)}
.kmods button.on{background:var(--tint);color:#fff}
.kp.locked .kpad,.kp.locked .kmods{opacity:.45;pointer-events:none}
.recbox{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0 4px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px color-mix(in srgb,var(--red) 30%,transparent)}
.mic svg{width:38px;height:38px}
.mic.on{animation:pulse 1.1s ease-in-out infinite}
.mic[disabled]{background:var(--fill);color:var(--label3);box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--red) 18%,transparent)}}
.cmpbtns{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.mt.snd{color:var(--tint)}
.mt.snd svg{width:24px;height:24px}
.hw{display:flex;align-items:center;gap:12px;text-align:left;margin-top:22px;padding:14px 16px;border-radius:14px;background:var(--card2)}
.hw>div{flex:1}
.hw b{display:block;font-size:16px}
.hw p{margin:2px 0 0;font-size:14px;color:var(--label2)}
.row.today .t b{font-weight:600;color:var(--tint)}

/* ================= WORKSHEETS ================= */
.ws{font-family:var(--font);color:#000;background:#fff;width:182mm;margin:0 auto;font-size:11pt;line-height:1.45;letter-spacing:0}
.ws [lang=ja]{font-family:var(--font-ja)}
.wh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5pt solid #000;padding-bottom:2mm;margin-bottom:5mm}
.wh b{font-size:16pt;display:block}
.wh div span{font-size:10pt;color:#555}
.wbrand{font-size:9pt;color:#777}
.wsec{margin:0 0 6mm}
.wsec h3{font-size:12pt;margin:0 0 1mm}
.wnote{font-size:9pt;color:#444;margin:0 0 2.5mm}
.wtr{display:flex;gap:1.5mm;align-items:center;margin-bottom:1.5mm;break-inside:avoid}
.wm{width:30mm;height:15mm;display:flex;align-items:center;gap:1mm;flex:none}
.wm span{font-size:22pt;width:12mm;text-align:center}
.wm .strokes{width:15mm;height:15mm;color:#000}
.wm .strokes .nums text{fill:#d00}
.wm .strokes .guide path{stroke:#ccc}
.wc,.wt{width:15mm;height:15mm;border:.6pt solid #999;position:relative;flex:none;background-image:linear-gradient(#ddd,#ddd),linear-gradient(#ddd,#ddd);background-size:100% .4pt,.4pt 100%;background-position:center,center;background-repeat:no-repeat}
.wc span{position:absolute;inset:0;display:grid;place-items:center;font-size:30pt;color:#c4c4c4;font-family:var(--font-ja)}
.wc.g2 span{color:#e4e4e4}
.wtable{display:grid;grid-template-columns:repeat(10,15mm);gap:1.2mm;justify-content:center}
.wt{width:auto}
.wt small{position:absolute;top:.4mm;left:1mm;font-size:7pt;color:#888}
.wt.empty{border:none;background:none}
.wsec.keep{break-inside:avoid}
.wlines{margin:0;padding:0;list-style:none}
.wlines li{height:11mm;border-bottom:.6pt solid #bbb;display:flex;align-items:flex-end;gap:3mm;padding-bottom:1mm;break-inside:avoid}
.wlines .no{flex:none;width:5mm;font-size:10pt;color:#555;font-weight:600}
.wlines.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:10mm}
.wlines.w2 li{height:auto;min-height:14mm;padding-top:2mm}
.wlines.w2 li>div{display:flex;flex-direction:column;justify-content:flex-end;gap:1mm;flex:1}
.wlines .ko{font-size:10pt;color:#333}
.wlines .jq{font-size:13pt}
.wlines .bl{display:inline-block;width:22mm;border-bottom:1pt solid #000;margin:0 1mm}
.wsay{margin:0;padding-left:7mm}
.wsay li{display:flex;align-items:center;gap:4mm;padding:1.6mm 0;border-bottom:.4pt solid #ddd;break-inside:avoid}
.wsay .jp{font-size:13pt;flex:1}
.wsay .ko{font-size:9.5pt;color:#555;width:45mm}
.wsay .ticks{display:flex;gap:1.2mm}
.wsay .ticks i{width:4.5mm;height:4.5mm;border:.6pt solid #888;border-radius:1mm}
.wpairs .wpr{display:flex;align-items:center;gap:1.5mm;margin-bottom:1.5mm;break-inside:avoid}
.wpr>span{font-size:20pt;width:12mm;text-align:center}
.wbox{height:62mm;border:.6pt solid #999;border-radius:2mm}
.wcards{display:grid;grid-template-columns:1fr 1fr;border-top:.6pt dashed #999;border-left:.6pt dashed #999}
.wcard{border-right:.6pt dashed #999;border-bottom:.6pt dashed #999;padding:2mm 3mm;display:flex;flex-direction:column;break-inside:avoid}
.wcard b{font-size:12pt;font-weight:600}
.wcard span{font-size:8.5pt;color:#555}
.wcard small{font-size:9pt}
.wcard.big b{font-size:15pt}
.wans{break-before:page}
.wans h3{font-size:13pt;margin:0 0 3mm}
.wans>div{margin-bottom:4mm;break-inside:avoid}
.wans b{font-size:10.5pt}
.wans ol{margin:1mm 0 0;padding-left:7mm;columns:2;font-size:11pt}
.wfoot{font-size:8pt;color:#777;margin-top:6mm}
.wsprev{background:#fff;border-radius:var(--r);padding:12px;overflow:hidden}
.wsprev .ws{zoom:.46;width:182mm}
#printarea{display:none}
html.wsmode,html.wsmode body{background:#fff}
html.wsmode #app{max-width:none;padding:0}
@page{size:A4;margin:14mm}
@media print{
  html.printing body>*:not(#printarea){display:none!important}
  html.printing #printarea{display:block}
  html,body{background:#fff!important}
  .ws{width:auto}
}
@media (prefers-reduced-motion:reduce){
  .strokes.anim .paths path{stroke-dashoffset:0!important}
  .caret{animation:none}
}

  } catch (e) {}
}

function speak(text, opt = {}) {
  const t = ttsText(text);
  if (!t.trim()) return Promise.resolve();
  let rate = opt.rate || S.settings.rate, vv = null;
  if (opt.vary) { rate = rate * [0.85, 1, 1.12][Math.floor(Math.random() * 3)]; const js = jaVoices(); if (js.length > 1) vv = js[Math.floor(Math.random() * js.length)]; }

    if ('speechSynthesis' in window && (JA || !CTTS)) {

        u.lang = 'ja-JP'; u.rate = rate;

        if (v) u.voice = v;

let ACTX = null;
function sfx(kind) {
  if (!S.settings.sfx) return;
  try {
    ACTX = ACTX || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ACTX.currentTime;
    const notes = kind === 'ok' ? [[880, 0], [1318.5, .09]] : kind === 'done' ? [[659.3, 0], [880, .1], [1318.5, .2]] : [[220, 0], [196, .12]];
    notes.forEach(([f, dt]) => {
      const o = ACTX.createOscillator(), g = ACTX.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(kind === 'bad' ? .12 : .16, t0 + dt + .015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + .22);
      o.connect(g).connect(ACTX.destination); o.start(t0 + dt); o.stop(t0 + dt + .25);
    });
  } catch (e) {}
}

function distinctByHg(list, n, taken = []) {

const REC = {mr: null, stream: null, url: null, timer: null};

const KP_COLS = [['あ','い','う','え','お'],['か','き','く','け','こ'],['さ','し','す','せ','そ'],['た','ち','つ','て','と'],['な','に','ぬ','ね','の'],['は','ひ','ふ','へ','ほ'],['ま','み','む','め','も'],['や','','ゆ','','よ'],['ら','り','る','れ','ろ'],['わ','を','ん','ー','']];
const DAKU_ON = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ','う':'ゔ'};
const HANDAKU_ON = {'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ'};
const SMALL_ON = {'あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ','や':'ゃ','ゆ':'ゅ','よ':'ょ','つ':'っ','わ':'ゎ'};
const hiraToKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

  const last = val.slice(-1), kata = isKata(last) && last !== 'ー', h = kataToHira(last);
  let out = h;
  if (kind === 'daku') out = DAKU_ON[h] || DAKU_OFF[h] || (HANDAKU_OFF[h] ? DAKU_ON[HANDAKU_OFF[h]] : h);
  if (kind === 'handaku') out = HANDAKU_ON[h] || HANDAKU_OFF[h] || (DAKU_OFF[h] && HANDAKU_ON[DAKU_OFF[h]]) || h;
  if (kind === 'small') out = SMALL_ON[h] || SMALL_OFF[h] || h;

}

    const cells = [];

function seeded(seed) { let a = (seed * 2654435761) >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function setTimeOn(date, n) { const [hh, mm] = S.settings.times[n - 1].split(':').map(Number); const d = parseYmd(date); d.setHours(hh, mm, 0, 0); return d; }
const commitSets = c => c.sets || [c.set];
const commitDone = c => commitSets(c).every(n => setStat(c.d, n) === 'done');
function dueCheck() {
  const now = Date.now(), t = today();
  for (const c of S.commits) if (!c.done && !c.asked && c.when && now >= c.when) {
    if (commitDone(c)) { c.done = true; continue; }
    return {kind: 'commit', c};
  }
  for (const date of [addDays(t, -1), t]) {
    const i = dayIdx(date); if (i < 0 || i >= DAYS.length) continue;
    const ns = [1, 2, 3].filter(n => !setStat(date, n) && !S.asked[`c:${date}:${n}`] && now >= setTimeOn(date, n).getTime() + 30 * 60000);
    if (ns.length) return {kind: 'set', date, ns};
  }
  return null;
}

  if (LESSON || SHEET || PAGES.length || !S.asked.welcome) return;

  if (c.kind === 'set') checkIn(c.date, c.ns); else commitCheck(c.c);
}
function markOutside(date, n, st, extra = {}) {

  if (st === 'done') {

  }
}

function nodeState(date, n, cur, until) {

function pShadow(list, title) {
  const st = {j: 0, playing: false, run: 0, rep: 2};
  const page = pushPage('따라 말하기', el => {
    const p = list[st.j];
    el.innerHTML = `<h1 class="large">따라 말하기</h1><p class="subtitle">${esc(title)} · 소리가 끝나면 바로 겹쳐서 말해요</p>

      <div class="hstack mt16" style="justify-content:center"><span class="tiny">반복</span><div class="seg" style="width:170px">${[1, 2, 3].map(n => `<button class="${st.rep === n ? 'on' : ''}" data-rep="${n}">${n}번</button>`).join('')}</div></div>
      <div class="rate mt16"><button class="btn grey" data-prev>이전</button><button class="btn grey" data-nx>다음</button></div>
      <button class="btn mt12" data-play>${st.playing ? IC.pause + ' 멈추기' : IC.play + ' 자동으로 넘기기'}</button>`;
    $$('[data-rep]', el).forEach(b => b.addEventListener('click', () => { st.rep = +b.dataset.rep; page.render(); }));
    $('[data-prev]', el).addEventListener('click', () => { st.j = (st.j - 1 + list.length) % list.length; stop(); page.render(); speak(list[st.j].k); });
    $('[data-nx]', el).addEventListener('click', () => { st.j = (st.j + 1) % list.length; stop(); page.render(); speak(list[st.j].k); });
    $('[data-play]', el).addEventListener('click', () => { if (st.playing) { stop(); page.render(); } else { st.playing = true; page.render(); loop(++st.run); } });
  });
  function stop() { st.playing = false; st.run++; stopSpeech(); }
  async function loop(run) {
    while (st.playing && run === st.run) {
      const p = list[st.j];
      for (let r = 0; r < st.rep && st.playing && run === st.run; r++) {
        const s = $('.sstate', page.el); if (s) s.textContent = '듣는 중';
        await speak(p.k);
        if (!st.playing || run !== st.run) return;
        const s2 = $('.sstate', page.el); if (s2) s2.textContent = '지금 따라 말해요';
        await new Promise(r2 => setTimeout(r2, 900 + clean(p.k).length * 220));
      }
      if (!st.playing || run !== st.run) return;
      st.j = (st.j + 1) % list.length; page.render();
    }
  }
  page.onClose = stop;
}

async function aiJSON(prompt) {
  if (!AI) throw new Error('no ai');
  if (typeof AI.json === 'function') { const v = await AI.json(prompt); if (v && typeof v === 'object') return v; }
  const r = await AI(prompt);
  const txt = (r && r.text) || '';
  const m = txt.match(/\{[\s\S]*\}/);
  return m ? JSON.parse(m[0]) : null;
}

  soundTest: () => { speak('こんにちは。にほんごの おんせいです。'); toast(JA ? `${JA.name}로 읽고 있어요` : '소리가 안 들리면 미디어 볼륨과 음성 엔진을 확인해요'); },
  kana: d => pKana(d.set),
  kanaInfo: d => kanaSheet(d.k),
  kq: d => {
    const all = kanaOf({hira: HIRA_ROWS, kata: KATA_ROWS, daku: DAKU_ROWS, yoon: YOON_ROWS}[d.set]);
    if (d.mode === 'speed') { runLesson({title: '전부 빠르게 읽기', items: shuffle(all).map(k => exRead(k, all, true)), requeue: false}); return; }
    if (d.mode === 'weak') { const w = weakKana(all); runLesson({title: '약한 글자', items: shuffle([...w.map(k => exRead(k, all)), ...w.map(k => exListenKana(k, all))])}); return; }
    const list = pick(all, 14);
    runLesson({title: d.mode === 'listen' ? '듣고 고르기' : '보고 읽기', items: [...list.map(k => d.mode === 'listen' ? exListenKana(k, all) : exRead(k, all)), exMatchKana(pick(all, 8))]});
  },
  confuse: () => pConfuse(),
  numbers: () => pNumbers(),
  numRun: d => runLesson({title: NUM_LEVELS[+d.lv].n, items: Array.from({length: 10}, () => exNum(+d.lv))}),
  pairs: () => runLesson({title: '발음 구별', items: pairSet(null, 12)}),
  pitfalls: () => pPitfalls(),
  hanja: () => runLesson({title: '한자어 읽기', items: [{t: 'rule', ...RULE_CARDS.hanja1[0]}, {t: 'rule', ...RULE_CARDS.hanja2[0]}, ...pick(HANJAEO, 12).map(exHanja)]}),
  signs: () => pSigns(),
  menu: () => pMenu(),
  scenes: () => pScenes(),
  scene: d => pScene(d.s),
  core: () => pCore(),
  shadowAll: () => { const ids = uniq(Object.keys(S.cards).filter(id => id.startsWith('p:')).map(id => id.slice(2))); const list = (ids.length ? ids : CORE30).map(id => PH_BY[id]).filter(Boolean); pShadow(list, ids.length ? '지금까지 배운 표현' : '핵심 30문장'); },
  recall: d => pRecall(d.d),
  memo: () => pMemo(),
  allCards: () => pAllCards(),
  book: () => pBook(),
  bookToggle: d => { S.book[d.n] = !S.book[d.n]; save(); topPage().render(); },
  depart: () => pDepart(),
  checkItem: d => { S.check[d.j] = !S.check[d.j]; save(); topPage().render(); },
  rp: d => runLesson({title: d.k === 'ALL' ? '하루 시나리오' : RP[d.k].name, items: rpSteps(d.k), requeue: false}),
  chat: d => runLesson({title: CHATS.find(c => c.id === d.id).name, items: chatSteps(d.id), requeue: false, onDone: () => { S.talkDone[d.id] = today(); }}),
  talkRules: () => pTalkRules(),
  slang: () => pSlang(),
  trends: () => pTrends(),
  aichat: () => pAIChat(),
  translate: () => pTranslate(),
  sos: () => pSOS(),
  sosShow: d => {
    if (d.j === 'al') { const al = S.allergen || []; sosFull(`${al.join('、')}のアレルギーがあります。これは入っていますか?`, `${al.map(a => (ALLERGENS.find(x => x[0] === a) || [])[1]).join(', ')} 알레르기가 있어요. 이거 들어 있나요?`); }
    else { const s = SOS[+d.j]; sosFull(s[0], s[1]); }
  },
  allergen: d => { S.allergen = S.allergen || []; const k = S.allergen.indexOf(d.a); if (k >= 0) S.allergen.splice(k, 1); else S.allergen.push(d.a); save(); topPage().render(); },
  log: d => pLog(d.why),
  set: d => { S.settings[d.k] = d.k === 'rate' ? +d.v : d.v; save(); render(); if (d.k === 'rate') speak('こんにちは'); },
  sfx: () => { S.settings.sfx = !S.settings.sfx; save(); render(); if (S.settings.sfx) sfx('ok'); },
  backup: () => { const txt = JSON.stringify(S); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('백업을 복사했어요. 메모 앱에 붙여 두세요'), () => showBackup(txt)); else showBackup(txt); },
  restore: () => openSheet(b => {
    b.innerHTML = `<h2>백업에서 되살리기</h2><p class="muted small">복사해 둔 백업을 붙여 넣어요. 지금 기록은 덮어써져요.</p>${IS_PWA ? '<input type="file" id="rsf" accept="application/json,.json,.txt" class="field mt12" aria-label="백업 파일">' : ''}<textarea class="field mt12" id="rs" placeholder="백업 붙여 넣기" aria-label="백업"></textarea><button class="btn mt12" data-ok>되살리기</button>`;
    const rf = $('#rsf', b); if (rf) rf.addEventListener('change', () => { const f = rf.files[0]; if (!f) return; f.text().then(t => { $('#rs', b).value = t; }); });
    $('[data-ok]', b).addEventListener('click', () => { try { const v = JSON.parse($('#rs', b).value); if (!v || typeof v !== 'object' || !v.settings) throw 0; S = loadState(v); save(); closeSheet(); render(); toast('되살렸어요'); } catch (e) { toast('백업 형식이 아니에요'); } });
  }),
  reset: () => openSheet(b => {
    b.innerHTML = `<h2>처음부터 다시 할까요?</h2><p class="muted small">세트 기록, XP, 카드, 테스트 결과가 전부 지워지고 되돌릴 수 없어요.</p><div class="stack mt16"><button class="btn red" data-ok>전부 지우기</button><button class="btn grey" data-no>취소</button></div>`;
    $('[data-ok]', b).addEventListener('click', () => { S = DEFAULT_STATE(); S.asked.welcome = 1; save(); closeSheet(); VIEW.scrolled = false; render(); toast('처음 상태로 돌렸어요'); });
    $('[data-no]', b).addEventListener('click', () => closeSheet());
  })
};
function showBackup(txt) { openSheet(b => { b.innerHTML = `<h2>백업</h2><p class="muted small">아래 글 전체를 길게 눌러 복사한 다음 메모 앱에 붙여 두세요.</p><textarea class="field mt12" readonly style="min-height:200px;font-size:12px" aria-label="백업">${esc(txt)}</textarea>`; }); }

const KEEP_SHEET = new Set(['say', 'reveal', 'tr']);
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a || a.tagName === 'A') return;
  const f = ACT[a.dataset.act];
  if (!f) return;
  e.preventDefault();
  if (SHEET && SHEET.sh.contains(a) && !KEEP_SHEET.has(a.dataset.act)) closeSheet(true);
  f(a.dataset, a);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('.sos')) $('.sos').remove();
  else if (SHEET && !SHEET.opt.sticky) closeSheet();
  else if (LESSON) { if (LESSON.finished) closeLesson(); else confirmQuit(); }
  else if (PAGES.length) popPage();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== S.tab && !LESSON) { closeAllPages(); S.tab = h; render(); } });

/* ---------- first run ---------- */
function welcome() {
  if (S.asked.welcome) return false;
  openSheet(b => {
    b.innerHTML = `<h2>일본 가기 전 6주</h2><p class="muted">11월 25일부터 1월 6일까지 하루 세 번, 20분씩 공부해요. 길에 있는 동그라미 하나가 세트 하나예요.</p>
      <p class="sh" style="margin-left:0">세트 시간을 정해 주세요</p>
      <div class="list">${[1, 2, 3].map(n => `<div class="row"><span class="t"><b>세트 ${n}</b><small>${['교재와 글자', '듣기와 말하기', '복습'][n - 1]}</small></span><input type="time" class="field tfield" data-wt="${n - 1}" value="${S.settings.times[n - 1]}" aria-label="세트 ${n} 시간"></div>`).join('')}</div>
      <p class="sf">세트 사이는 3시간 이상 띄우는 게 좋아요. 시간이 지나면 했는지 물어보고, 못 했으면 이유를 꼭 물어볼 거예요.</p>
      <button class="btn mt16" data-go>시작하기</button>`;
    $('[data-go]', b).addEventListener('click', () => { $$('[data-wt]', b).forEach(i => { if (i.value) S.settings.times[+i.dataset.wt] = i.value; }); S.asked.welcome = 1; save(); closeSheet(); render(); });
  }, {sticky: true});
  return true;
}

/* ================= INSTALLED APP (PWA) ================= */
let INSTALL_EVT = null;
function isStandalone() {
  try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; }
}
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installBanner() {
  if (!IS_PWA || isStandalone() || S.asked.install) return '';
  const ios = isIOS();
  return `<div class="notice info"><b>홈 화면에 설치해 두세요</b>
    <p>${ios ? 'Safari 아래쪽 공유 버튼을 누르고 홈 화면에 추가를 골라요. 그다음부터는 홈 화면 아이콘으로 열어야 기록이 이어져요.' : INSTALL_EVT ? '설치하면 앱처럼 바로 열려요.' : 'Chrome 오른쪽 위 메뉴에서 앱 설치나 홈 화면에 추가를 골라요.'}</p>
    <div class="hstack mt8">${!ios && INSTALL_EVT ? '<button class="btn sm" data-act="install">설치하기</button>' : ''}<button class="btn sm grey" data-act="hideInstall">나중에</button></div></div>`;
}
function downloadFile(name, text, type) {
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line) {
  const out = []; let cur = '', bytes = 0;
  for (const ch of line) {
    const b = new TextEncoder().encode(ch).length;
    if (bytes + b > 73) { out.push(cur); cur = ' ' + ch; bytes = 1 + b; } else { cur += ch; bytes += b; }
  }
  out.push(cur);
  return out.join('\r\n');
}
function makeICS(times) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//nihongo6//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:일본어 6주', 'X-WR-TIMEZONE:Asia/Seoul',
    'BEGIN:VTIMEZONE', 'TZID:Asia/Seoul', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0900', 'TZOFFSETTO:+0900', 'TZNAME:KST', 'END:STANDARD', 'END:VTIMEZONE'];
  DAYS.forEach((d, i) => {
    const date = dateOfIdx(i).replace(/-/g, '');
    [1, 2, 3].forEach(n => {
      const [hh, mm] = times[n - 1].split(':').map(Number);
      const end = hh * 60 + mm + 20;
      const st = `${date}T${pad(hh)}${pad(mm)}00`;
      const enDate = end >= 1440 ? addDays(dateOfIdx(i), 1).replace(/-/g, '') : date;
      const en = `${enDate}T${pad(Math.floor(end % 1440 / 60))}${pad(end % 60)}00`;
      const info = setInfo(i, n);
      L.push('BEGIN:VEVENT', `UID:nihongo6-${date}-${n}@nihongo6`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Asia/Seoul:${st}`, `DTEND;TZID=Asia/Seoul:${en}`,
        icsFold('SUMMARY:' + icsEscape(`일본어 세트 ${n} · ${info.name}`)), icsFold('DESCRIPTION:' + icsEscape(`${i + 1}일째 · ${d.t}\n앱을 열고 오늘 동그라미를 누르면 시작돼요.`)),
        'BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEscape(`일본어 세트 ${n} 시간이에요. 20분이면 돼요.`)), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
Object.assign(ACT, {
  install: async () => {
    if (!INSTALL_EVT) return;
    INSTALL_EVT.prompt();
    try { const r = await INSTALL_EVT.userChoice; if (r && r.outcome === 'accepted') { S.asked.install = 1; save(); } } catch (e) {}
    INSTALL_EVT = null; render();
  },
  hideInstall: () => { S.asked.install = 1; save(); render(); },
  ics: () => {
    downloadFile('nihongo6-alarms.ics', makeICS(S.settings.times), 'text/calendar');
    openSheet(b => {
      b.innerHTML = `<h2>캘린더 알림 파일</h2><p class="muted small">세트 129개가 알림과 함께 들어 있는 파일을 받았어요.</p>
        <div class="card small mt12"><b>갤럭시</b><br>삼성 캘린더는 이 파일을 직접 못 열어요. 컴퓨터에서 Google 캘린더 웹을 열고 설정, 가져오기 및 내보내기로 들어가 파일을 올리면 폰 캘린더에도 들어와요.</div>
        <div class="card small mt8"><b>아이폰</b><br>파일 앱에서 nihongo6-alarms.ics를 누르고 모두 추가를 골라요.</div>
        <button class="btn mt16" data-ok>확인</button>`;
      $('[data-ok]', b).addEventListener('click', () => closeSheet());
    });
  },
  backupFile: () => { downloadFile(`nihongo6-backup-${today()}.json`, JSON.stringify(S), 'application/json'); toast('백업 파일을 저장했어요'); }
});
function initPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; if (S.tab === 'learn' && !PAGES.length && !LESSON) render(); });
  window.addEventListener('appinstalled', () => { S.asked.install = 1; save(); if (!LESSON) render(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('새 버전이 준비됐어요. 앱을 껐다 켜면 바뀌어요'); });
      });
    }).catch(() => {});
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

/* ---------- boot ---------- */
(function boot() {
  const h = location.hash.slice(1);
  if (h.startsWith('ws=day-')) {
    const i = +h.slice(7) - 1;
    if (i >= 0 && i < DAYS.length) { document.documentElement.classList.add('wsmode'); appEl.innerHTML = wsHTML(worksheetFor(i)); return; }
  }
  S.tab = TABS.some(t => t[0] === h) ? h : 'learn';
  render();
  setInterval(globalTick, 1000);
  setInterval(() => { if (!LESSON && !PAGES.length && !SHEET) { if (S.tab === 'learn') render(); maybeCheckIn(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { globalTick(); if (!LESSON && !PAGES.length && !SHEET) { render(); setTimeout(maybeCheckIn, 500); } } });
  setTimeout(() => { if (!welcome()) maybeCheckIn(); }, 400);
  initSync();
  initCaps();
  if (IS_PWA) initPWA();
})();

})();
</script>
