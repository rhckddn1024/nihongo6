<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="일본어 6주">
<title>일본어 6주</title>
<style>
/*
VOICE: calm, personal, a daily companion — iOS system app, not a web page.
IDEA: Apple's own Fitness + Notes language — inset grouped lists, large titles, three activity rings for three study sets.
PICTURE: the rings on Today; elsewhere the working tool (card, timer, chat) is the picture.
COLOUR and TYPE: system greys, one blue tint, ring colours red/green/cyan; SF / Apple SD Gothic Neo / Hiragino, Japanese spans tagged lang=ja.
LAYOUT: one column max 640px, bottom tab bar with blur, sheets slide up from the bottom.
*/
:root{
  color-scheme:light dark;
  --bg:light-dark(#F2F2F7,#000000);
  --card:light-dark(#FFFFFF,#1C1C1E);
  --card2:light-dark(#F2F2F7,#2C2C2E);
  --fill:light-dark(rgba(120,120,128,.12),rgba(118,118,128,.24));
  --fill2:light-dark(rgba(120,120,128,.08),rgba(118,118,128,.18));
  --label:light-dark(#000000,#FFFFFF);
  --label2:light-dark(rgba(60,60,67,.62),rgba(235,235,245,.62));
  --label3:light-dark(rgba(60,60,67,.34),rgba(235,235,245,.34));
  --sep:light-dark(rgba(60,60,67,.18),rgba(84,84,88,.55));
  --tint:light-dark(#007AFF,#0A84FF);
  --tint-soft:light-dark(rgba(0,122,255,.12),rgba(10,132,255,.22));
  --red:light-dark(#FF3B30,#FF453A);
  --green:light-dark(#34C759,#30D158);
  --orange:light-dark(#FF9500,#FF9F0A);
  --ring1:light-dark(#FA114F,#FA114F);
  --ring2:light-dark(#4CD964,#92E82A);
  --ring3:light-dark(#0FB6D6,#1EEAEF);
  --bar:light-dark(rgba(249,249,249,.82),rgba(22,22,24,.78));
  --shadow:light-dark(0 1px 2px rgba(0,0,0,.04),0 0 0 rgba(0,0,0,0));
  --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",-apple-system,system-ui,sans-serif;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--label)}
body{font:17px/1.42 var(--font);letter-spacing:-.01em;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100dvh}
[lang=ja]{font-family:var(--font-ja);letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:17px;color:var(--label)}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:8px}
a{color:var(--tint);text-decoration:none}
[hidden]{display:none!important}
#nl-badge-frame{display:none!important}
.list a.row{color:inherit}

/* ---------- app shell ---------- */
#app{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px;min-height:52px;
  background:transparent;transition:background .2s,border-color .2s;border-bottom:.5px solid transparent}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.topbar .mini{flex:1;text-align:center;font-weight:600;font-size:17px;opacity:0;transition:opacity .2s}
.topbar.scrolled .mini{opacity:1}
.topbar .side{width:88px;display:flex;align-items:center}
.topbar .side.r{justify-content:flex-end}
.navbtn{color:var(--tint);font-size:17px;display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 4px}
.navbtn svg{width:22px;height:22px}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin:2px 0 2px}
.subtitle{color:var(--label2);font-size:15px;margin:0 0 18px}

/* ---------- lists ---------- */
.sh{font-size:13px;color:var(--label2);margin:26px 16px 7px;font-weight:400}
.sh.big{font-size:22px;font-weight:700;color:var(--label);margin:28px 0 10px}
.sf{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.38}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;width:100%;text-align:left}
.row+.row::before,.row+.rowwrap::before,.rowwrap+.row::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.row.ic+.row::before,.row.ic+.row.ic::before{left:58px}
button.row:active,.row.tap:active{background:var(--fill)}
.row .t{flex:1;display:flex;flex-direction:column;gap:1px}
.row .t b{font-weight:400}
.row .t small{color:var(--label2);font-size:15px;line-height:1.3}
.row .v{color:var(--label2);font-size:17px;white-space:nowrap}
.chev{width:9px;height:14px;color:var(--label3);flex:none}
.icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.icon svg{width:19px;height:19px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:600;display:inline-grid;place-items:center}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.hstack{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{white-space:nowrap;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:var(--tint);color:#fff;font-weight:600;font-size:17px;width:100%}
.btn:active{opacity:.75}
.stack>.btn,.rate>.btn{flex:1 1 auto}
.btn.soft{background:var(--tint-soft);color:var(--tint)}
.btn.grey{background:var(--fill);color:var(--label)}
.btn.red{background:var(--red)}
.btn.green{background:var(--green)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px;border-radius:18px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:var(--fill);font-size:15px;color:var(--label);white-space:nowrap}
.pill.on{background:var(--tint);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .pill{flex:none}
.muted{color:var(--label2)}
.small{font-size:15px}
.tiny{font-size:13px;color:var(--label2)}
.center{text-align:center}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.spk{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--tint);background:var(--tint-soft);flex:none}
.spk svg{width:19px;height:19px}
.spk:active{transform:scale(.94)}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label)}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
/* switch */
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}

/* inputs */
.field{width:100%;min-height:44px;border-radius:10px;background:var(--fill);border:0;padding:10px 12px;font-size:17px}
textarea.field{min-height:120px;resize:vertical;line-height:1.5}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:38px;padding:0 10px;color:var(--label2)}
.search input{flex:1;background:none;border:0;outline:0;height:100%;font-size:17px}
.search svg{width:17px;height:17px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:640px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--label3);font-size:10.5px;font-weight:500;min-height:50px}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--tint)}
.tabbar .tb-badge{position:absolute;margin-left:22px;margin-top:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* live pill (running set timer) */
.live{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));z-index:40;background:#000;color:#fff;border-radius:22px;height:36px;padding:0 6px 0 14px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.live .ld{width:8px;height:8px;border-radius:50%}
.live .lt{font-variant-numeric:tabular-nums}
.live button{height:26px;padding:0 10px;border-radius:13px;background:rgba(255,255,255,.18);font-size:13px}

/* ---------- today ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rings{width:132px;height:132px}
.rings svg{width:100%;height:100%;transform:rotate(-90deg)}
.dday .num{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dday .lbl{font-size:15px;color:var(--label2)}
.legend{display:flex;flex-direction:column;gap:3px;margin-top:10px;font-size:14px}
.legend span{display:flex;align-items:center;gap:7px;color:var(--label2)}
.legend b{font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px}
.week button .wd{font-size:12px;color:var(--label2)}
.week button .dn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.week button.today .dn{color:var(--red);font-weight:700}
.week button.sel .dn{background:var(--label);color:var(--bg)}
.week button.sel.today .dn{background:var(--red);color:#fff}
.week .mini-dots{display:flex;gap:2px;height:5px}
.week .mini-dots i{width:5px;height:5px;border-radius:50%;background:var(--fill)}
.setcard{display:flex;gap:14px;align-items:flex-start}
.setcard .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.setcard h3{margin:0;font-size:17px;font-weight:600}
.setcard p{margin:3px 0 0;color:var(--label2);font-size:15px}
.setcard .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{font-size:13px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.status.done{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.status.part{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.status.skip{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.status.wait{background:var(--fill);color:var(--label2)}
.banner{border-radius:var(--r);padding:14px 16px;background:color-mix(in srgb,var(--orange) 14%,var(--card));display:flex;gap:12px;align-items:flex-start}
.banner.red{background:color-mix(in srgb,var(--red) 12%,var(--card))}
.banner.blue{background:var(--tint-soft)}
.banner b{display:block;font-weight:600}
.banner p{margin:2px 0 0;font-size:15px;color:var(--label2)}

/* ---------- sheet & page ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1);max-width:640px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.sheet h2{font-size:22px;font-weight:700;margin:6px 0 4px}
.page{position:fixed;inset:0;z-index:45;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .34s cubic-bezier(.32,.72,0,1)}
.page.show{transform:none}
.page .inner{max-width:640px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(30,30,32,.94);color:#fff;padding:11px 18px;border-radius:22px;font-size:15px;z-index:80;opacity:0;transition:all .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- kana ---------- */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc{background:var(--card);border-radius:12px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.kc:active{background:var(--fill)}
.kc .kj{font-size:30px;line-height:1.1}
.kc .kr{font-size:12px;color:var(--label2);line-height:1.2}
.kc.empty{background:transparent}
.kc .lv{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%}
.bigkana{font-size:min(38vw,150px);line-height:1;text-align:center;margin:10px 0}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa button{min-height:64px;border-radius:14px;background:var(--card);font-size:20px;font-weight:500;padding:8px}
.qa button.ok{background:var(--green);color:#fff}
.qa button.no{background:var(--red);color:#fff}
.progress{height:4px;background:var(--fill);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--tint);border-radius:2px;transition:width .25s}

/* ---------- flash card ---------- */
.flash{background:var(--card);border-radius:20px;min-height:300px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.flash .front{font-size:30px;font-weight:600;line-height:1.3}
.flash .front.ja{font-size:34px}
.flash .ctx{font-size:15px;color:var(--label2)}
.flash .ans{font-size:26px;line-height:1.35}
.flash .hg{font-size:16px;color:var(--label2)}
.rate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kind{font-size:12px;font-weight:600;color:var(--tint);letter-spacing:.02em}

/* ---------- phrase rows ---------- */
.ph{display:flex;gap:12px;align-items:center;padding:12px 16px;position:relative}
.ph+.ph::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--sep)}
.ph .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.ph .jp{font-size:19px;line-height:1.35}
.ph .hg{font-size:14px;color:var(--label2)}
.ph .hg.hid{color:transparent;background:var(--fill);border-radius:5px;width:max-content;max-width:100%;padding:0 4px}
.ph .ko{font-size:15px;color:var(--label2)}
.ph .cas{font-size:15px;color:var(--tint)}
.ph .note{font-size:13px;color:var(--label2)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--label2);margin-right:4px;vertical-align:1px}
.tag.staff{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
.tag.cas{background:var(--tint-soft);color:var(--tint)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:8px;padding:8px 0 16px}
.bub{max-width:80%;padding:9px 14px;border-radius:19px;font-size:17px;line-height:1.38;position:relative}
.bub.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--tint);color:#fff;border-bottom-right-radius:6px}
.bub .tr{display:block;font-size:13px;opacity:.7;margin-top:3px}
.bub.me .tr{opacity:.85}
.sysmsg{align-self:center;font-size:13px;color:var(--label2);text-align:center;max-width:90%}
.fb{align-self:stretch;border-radius:14px;padding:10px 14px;font-size:15px;background:var(--card)}
.fb.good{background:color-mix(in srgb,var(--green) 14%,var(--card))}
.fb.ok{background:color-mix(in srgb,var(--orange) 14%,var(--card))}
.fb.bad{background:color-mix(in srgb,var(--red) 12%,var(--card))}
.choices{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.choice{background:var(--card);border-radius:14px;padding:11px 14px;text-align:left;border:1px solid var(--sep)}
.choice small{display:block;color:var(--label2);font-size:13px}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;min-height:40px;max-height:120px;border-radius:20px;background:var(--card);border:.5px solid var(--sep);padding:9px 14px;resize:none;font-size:17px;line-height:1.3}
.send{width:36px;height:36px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none;margin-bottom:2px}
.send svg{width:18px;height:18px}

/* ---------- timer ---------- */
.timer{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:8px auto 4px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .tt b{font-size:56px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .tt span{color:var(--label2);font-size:15px}

/* bars */
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:76px 1fr 40px;gap:10px;align-items:center;font-size:15px}
.brow .tr{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:4px}
.brow .n{text-align:right;color:var(--label2);font-variant-numeric:tabular-nums}

/* sos */
.sos{position:fixed;inset:0;z-index:90;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.sos .big{font-family:var(--font-ja);font-size:clamp(34px,9vw,64px);font-weight:700;line-height:1.35}
.sos .ko{font-size:18px;color:#555;margin-top:18px}
.sos .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:22px;background:#eee;display:grid;place-items:center}

.empty-state{padding:36px 16px;text-align:center;color:var(--label2)}
.kbd{font-variant-numeric:tabular-nums}
.res-big{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.ok-t{color:var(--green)}.no-t{color:var(--red)}.warn-t{color:var(--orange)}
details.more summary{cursor:pointer;color:var(--tint);font-size:15px;padding:10px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}

async function flushRemote() {

  } finally { dbWriting = false; if (dbDirty) setTimeout(flushRemote, 1500); }
}
async function initSync() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;

    const ref = db.doc('data/users/' + uid + '/state');
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej({code: 'timeout'}), 10000))]);
    dbRef = ref;
    if (snap.exists) {
      const body = snap.data() || {};
      let remote = null;
      try { remote = JSON.parse(body.json || 'null'); } catch (e) { remote = null; }
      if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
        const keepTab = S.tab;

        try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}

const HG = {'あ':'아','い':'이','う':'우','え':'에','お':'오','か':'카','き':'키','く':'쿠','け':'케','こ':'코','が':'가','ぎ':'기','ぐ':'구','げ':'게','ご':'고','さ':'사','し':'시','す':'스','せ':'세','そ':'소','ざ':'자','じ':'지','ず':'즈','ぜ':'제','ぞ':'조','た':'타','ち':'치','つ':'츠','て':'테','と':'토','だ':'다','ぢ':'지','づ':'즈','で':'데','ど':'도','な':'나','に':'니','ぬ':'누','ね':'네','の':'노','は':'하','ひ':'히','ふ':'후','へ':'헤','ほ':'호','ば':'바','び':'비','ぶ':'부','べ':'베','ぼ':'보','ぱ':'파','ぴ':'피','ぷ':'푸','ぺ':'페','ぽ':'포','ま':'마','み':'미','む':'무','め':'메','も':'모','や':'야','ゆ':'유','よ':'요','ら':'라','り':'리','る':'루','れ':'레','ろ':'로','わ':'와','を':'오','ゔ':'부','ぁ':'아','ぃ':'이','ぅ':'우','ぇ':'에','ぉ':'오','ゃ':'야','ゅ':'유','ょ':'요'};
const HG2 = {'きゃ':'캬','きゅ':'큐','きょ':'쿄','ぎゃ':'갸','ぎゅ':'규','ぎょ':'교','しゃ':'샤','しゅ':'슈','しょ':'쇼','じゃ':'자','じゅ':'주','じょ':'조','ちゃ':'차','ちゅ':'추','ちょ':'초','にゃ':'냐','にゅ':'뉴','にょ':'뇨','ひゃ':'햐','ひゅ':'휴','ひょ':'효','びゃ':'뱌','びゅ':'뷰','びょ':'뵤','ぴゃ':'퍄','ぴゅ':'퓨','ぴょ':'표','みゃ':'먀','みゅ':'뮤','みょ':'묘','りゃ':'랴','りゅ':'류','りょ':'료','ふぁ':'화','ふぃ':'휘','ふぇ':'페','ふぉ':'포','てぃ':'티','でぃ':'디','とぅ':'투','どぅ':'두','うぃ':'위','うぇ':'웨','うぉ':'워','ちぇ':'체','しぇ':'셰','じぇ':'제','ゔぁ':'바','ゔぃ':'비','ゔぇ':'베','ゔぉ':'보'};
const VOWEL_SETS = {a:'あかがさざただなはばぱまやらわぁゃ',i:'いきぎしじちぢにひびぴみりぃ',u:'うくぐすずつづぬふぶぷむゆるぅゅゔ',e:'えけげせぜてでねへべぺめれぇ',o:'おこごそぞとどのほぼぽもよろをぉょ'};
const vowelOf = c => { for (const v in VOWEL_SETS) if (VOWEL_SETS[v].includes(c)) return v; return ''; };
const kataToHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function addFinal(out, T) {
  const c = out.charCodeAt(out.length - 1);
  if (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 === 0) return out.slice(0, -1) + String.fromCharCode(c + T);
  return T === 4 ? out + '응' : out;
}
function toHangul(src) {
  let s = String(src).replace(/_は/g, '\u0001').replace(/_へ/g, '\u0002').replace(/_を/g, '\u0003').replace(/_/g, '');
  s = kataToHira(s);
  let out = '', pv = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i], two = s.substr(i, 2);
    if (c === '\u0001') { out += '와'; pv = 'a'; continue; }
    if (c === '\u0002') { out += '에'; pv = 'e'; continue; }
    if (c === '\u0003') { out += '오'; pv = 'o'; continue; }
    if (c === 'っ') { out = addFinal(out, 19); pv = ''; continue; }
    if (c === 'ん') { out = addFinal(out, 4); pv = ''; continue; }
    if (c === 'ー') { out += '-'; continue; }
    if (HG2[two]) { out += HG2[two]; pv = vowelOf(two[1]); i++; continue; }
    if (HG[c]) {
      if (pv && ((c === 'う' && (pv === 'o' || pv === 'u')) || (c === 'い' && (pv === 'e' || pv === 'i')) || (c === 'あ' && pv === 'a') || (c === 'え' && pv === 'e') || (c === 'お' && pv === 'o'))) { out += '-'; pv = ''; continue; }
      out += HG[c]; pv = vowelOf(c); continue;
    }
    const p = {' ':' ','、':', ','。':'. ','?':'?','!':'!','?':'?','!':'!','〜':'~'}[c];
    out += p !== undefined ? p : c; pv = '';
  }
  return out.replace(/\s+/g, ' ').trim();
}
const clean = s => String(s).replace(/_/g, '');
const ttsText = s => clean(s).replace(/〇〇/g, 'なになに').replace(/\((.*?)\)/g, '');

const D1 = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];
function u10k(n) {
  let s = '';
  const th = Math.floor(n / 1000), hu = Math.floor(n % 1000 / 100), te = Math.floor(n % 100 / 10), on = n % 10;
  if (th) s += ['', 'せん', 'にせん', 'さんぜん', 'よんせん', 'ごせん', 'ろくせん', 'ななせん', 'はっせん', 'きゅうせん'][th];
  if (hu) s += ['', 'ひゃく', 'にひゃく', 'さんびゃく', 'よんひゃく', 'ごひゃく', 'ろっぴゃく', 'ななひゃく', 'はっぴゃく', 'きゅうひゃく'][hu];
  if (te) s += (te === 1 ? '' : D1[te]) + 'じゅう';
  if (on) s += D1[on];
  return s;
}
const numKana = n => n === 0 ? 'ゼロ' : (Math.floor(n / 10000) ? u10k(Math.floor(n / 10000)) + 'まん' : '') + (n % 10000 ? u10k(n % 10000) : '');

}

let VOICES = [], JA = null;

    JA = ja.find(v => v.voiceURI === S.settings.voice) || ja.find(v => /Kyoko|O-ren|Google/i.test(v.name)) || ja[0] || null;
  } catch (e) {}
}

const jaVoices = () => VOICES.filter(v => /^ja/i.test(v.lang));
function speak(text, opt = {}) {
  const t = ttsText(text);
  if (!t.trim()) return;
  const rate = opt.rate || S.settings.rate;
  if ('speechSynthesis' in window && (JA || !CTTS)) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);

      if (v) u.voice = v;
      speechSynthesis.speak(u);
      return;
    } catch (e) {}
  }
  if (CTTS) { CTTS.speak(t, {language: 'ja', rate: clamp(rate, .7, 1.5)}).catch(() => {}); return; }
  toast('이 기기에서 일본어 음성을 찾지 못했어');
}

const PAGES = [];

  document.body.appendChild(el);

  const page = {el, inner, title, build, opt, onClose: null};
  page.render = () => { inner.innerHTML = ''; build(inner, page); };
  el.addEventListener('scroll', () => $('.topbar', el).classList.toggle('scrolled', el.scrollTop > 24), {passive: true});
  PAGES.push(page);
  page.render();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  updateLive();

}

/* ---------- multiple-choice quiz ---------- */
function runQuiz(cfg) {
  const items = cfg.items.slice();
  const st = {i: 0, ok: 0, wrong: [], times: [], t0: 0, answered: false, done: false};
  const page = pushPage(cfg.title, el => {
    if (st.done) return renderResult(el);
    const it = items[st.i];
    el.innerHTML = `
      <div class="large" style="font-size:28px;line-height:34px">${esc(cfg.title)}</div>
      <div class="hstack mt8"><div class="progress grow"><i style="width:${st.i / items.length * 100}%"></i></div><span class="tiny kbd">${st.i + 1} / ${items.length}</span></div>
      ${cfg.timed ? `<p class="tiny mt8">목표: 한 문제 ${cfg.timed / 1000}초 안에</p>` : ''}
      <div class="flash mt16" style="min-height:220px">${it.q}${it.audio ? `<button class="btn soft sm" data-act="say" data-t="${esc(it.audio)}">${IC.spk} 다시 듣기</button>` : ''}</div>
      <div class="qa mt16">${it.opts.map((o, j) => `<button data-qi="${j}" ${o.ja ? 'lang="ja"' : ''}>${o.h}</button>`).join('')}</div>
      <div class="qexp mt16"></div>`;
    st.answered = false; st.t0 = performance.now();
    if (it.audio && it.autoAudio !== false) setTimeout(() => speak(it.audio), 120);
    $$('.qa button', el).forEach(b => b.addEventListener('click', () => answer(+b.dataset.qi, el)));
  });
  function answer(j, el) {
    if (st.answered) return; st.answered = true;
    const it = items[st.i], ms = performance.now() - st.t0, o = it.opts[j];
    const ok = o.v === it.ans;
    st.times.push(ms);
    if (it.kana) kanaStat(it.kana, ok, ms);
    const btns = $$('.qa button', el);
    btns.forEach((b, k) => { if (it.opts[k].v === it.ans) b.classList.add('ok'); });
    if (ok) { st.ok++; haptic(); } else { btns[j].classList.add('no'); st.wrong.push(it); if (it.srs && S.cards[it.srs]) grade(it.srs, 'wrong'); }
    if (it.after) speak(it.after);
    const slow = cfg.timed && ms > cfg.timed;
    const exp = $('.qexp', el);
    if (!ok || it.explain || slow) {
      exp.innerHTML = `${slow && ok ? `<p class="warn-t small center">맞았는데 ${(ms / 1000).toFixed(1)}초. 목표보다 느려</p>` : ''}${it.explain ? `<div class="card small">${it.explain}</div>` : ''}<button class="btn mt12" data-next>다음</button>`;
      $('[data-next]', exp).addEventListener('click', next);
    } else setTimeout(next, 520);
  }
  function next() { st.i++; if (st.i >= items.length) { st.done = true; save(); if (cfg.onDone) cfg.onDone(result()); } page.render(); }
  function result() { const avg = st.times.length ? st.times.reduce((a, b) => a + b, 0) / st.times.length : 0; return {ok: st.ok, total: items.length, avg, wrong: st.wrong}; }
  function renderResult(el) {
    const r = result(), pct = Math.round(r.ok / r.total * 100);
    el.innerHTML = `
      <div class="large" style="font-size:28px">${esc(cfg.title)}</div>
      <div class="card center mt16"><div class="res-big ${pct >= 90 ? 'ok-t' : pct >= 70 ? 'warn-t' : 'no-t'}">${pct}%</div>
      <p class="muted">${r.ok} / ${r.total} 정답${cfg.timed ? ` · 평균 ${(r.avg / 1000).toFixed(2)}초` : ''}</p>
      ${cfg.passText ? `<p class="small">${cfg.passText(r)}</p>` : ''}</div>
      ${r.wrong.length ? `<p class="sh">틀린 문제</p><div class="list">${r.wrong.map(w => `<div class="row"><span class="t"><b>${w.label || w.q}</b>${w.ansLabel ? `<small>${w.ansLabel}</small>` : ''}</span></div>`).join('')}</div>` : ''}
      <div class="stack mt24">${r.wrong.length && !cfg.noRetry ? `<button class="btn soft" data-retry>틀린 것만 다시</button>` : ''}<button class="btn" data-act="back">완료</button></div>`;
    const rb = $('[data-retry]', el);
    if (rb) rb.addEventListener('click', () => { popPage(); setTimeout(() => runQuiz(Object.assign({}, cfg, {items: shuffle(r.wrong), onDone: null, title: cfg.title + ' (다시)'})), 60); });
  }
  return page;
}
function kanaQuizItems(pool, mode, dpool) {
  dpool = dpool || pool;
  return shuffle(pool).map(k => {
    const info = KANA_INFO[k];
    const others = pick(dpool.filter(x => x !== k && KANA_INFO[x].hg !== info.hg), 3);

function runFlash(cfg) {
  const queue = cfg.items.filter(Boolean).slice();
  const st = {i: 0, ok: 0, slow: 0, wrong: 0, revealed: false, t0: 0, requeued: new Set(), started: Date.now(), done: false, wrongItems: []};
  const page = pushPage(cfg.title, el => {
    if (st.done || !queue.length) return renderEnd(el);
    const it = queue[st.i];
    const mins = Math.floor((Date.now() - st.started) / 60000);
    el.innerHTML = `
      <div class="hstack" style="justify-content:space-between"><div class="large" style="font-size:28px;line-height:34px">${esc(cfg.title)}</div>${cfg.target ? `<span class="tiny kbd">${mins}분 / ${cfg.target}분</span>` : ''}</div>
      <div class="hstack mt8"><div class="progress grow"><i style="width:${st.i / queue.length * 100}%"></i></div><span class="tiny kbd">${st.i + 1} / ${queue.length}</span></div>
      <div class="flash mt16" data-card><span class="kind">${esc(it.kind || '')}</span>${it.front}<div class="backside" hidden>${it.back}</div></div>
      <div class="mt16 acts">${st.revealed ? '' : '<button class="btn" data-reveal>정답 보기</button>'}</div>`;
    st.t0 = performance.now();
    if (it.frontAudio) setTimeout(() => speak(it.audio), 150);
    const reveal = () => {
      if (st.revealed) return; st.revealed = true;
      const ms = performance.now() - st.t0; st.ms = ms;
      $('.backside', el).hidden = false;
      if (it.audio) speak(it.audio);
      $('.acts', el).innerHTML = `<p class="tiny center">${(ms / 1000).toFixed(1)}초 걸림${ms > 3000 ? ' · 맞아도 느림 처리' : ''}</p><div class="rate mt8"><button class="btn grey" data-r="wrong">${IC.x} 틀렸어</button><button class="btn green" data-r="ok">${IC.check} 맞았어</button></div>`;
      $$('[data-r]', el).forEach(b => b.addEventListener('click', () => rateIt(b.dataset.r)));
    };
    $('[data-reveal]', el) && $('[data-reveal]', el).addEventListener('click', reveal);
    $('[data-card]', el).addEventListener('click', e => { if (!e.target.closest('[data-act]')) reveal(); });
  });
  function rateIt(r) {
    const it = queue[st.i];
    let res = r === 'wrong' ? 'wrong' : (st.ms > 3000 ? 'slow' : 'ok');
    if (res === 'wrong') { st.wrong++; st.wrongItems.push(it); if (!st.requeued.has(it.id || st.i)) { st.requeued.add(it.id || st.i); queue.push(it); } }
    else if (res === 'slow') st.slow++; else st.ok++;
    if (it.kana) kanaStat(it.kana, res !== 'wrong', st.ms);
    if (cfg.srs && it.id && !it._graded) { grade(it.id, res); it._graded = true; }
    if (cfg.onRate) cfg.onRate(it, res);
    st.revealed = false; st.i++;
    if (st.i >= queue.length) { st.done = true; save(); if (cfg.onDone) cfg.onDone({ok: st.ok, slow: st.slow, wrong: st.wrong, total: cfg.items.length, wrongItems: st.wrongItems}); }
    page.render();
  }
  function renderEnd(el) {
    const mins = Math.max(1, Math.round((Date.now() - st.started) / 60000));
    el.innerHTML = `<div class="large" style="font-size:28px">${esc(cfg.title)}</div>
      ${queue.length ? `<div class="card center mt16"><div class="res-big ok-t">${st.ok + st.slow}</div><p class="muted">맞힘 ${st.ok} · 느림 ${st.slow} · 틀림 ${st.wrong} · ${mins}분</p>
      <p class="small">${st.wrong ? '틀린 카드는 내일 다시 나와.' : '전부 맞혔어. 다음 복습 날짜가 뒤로 밀렸어.'}</p></div>` : `<div class="empty-state">오늘 할 카드가 없어</div>`}
      <div class="stack mt24"><button class="btn" data-act="back">완료</button></div>`;
  }
  return page;
}

/* ---------- roleplay (staff ↔ me) ---------- */
function runRoleplay(key) {
  const steps = key === 'ALL' ? ['konbini', 'train', 'restaurant', 'pharmacy', 'stay'].flatMap(k => RP[k].steps.map(s => Object.assign({scene: RP[k].name}, s))) : RP[key].steps;
  const name = key === 'ALL' ? '하루 시나리오' : RP[key].name;
  const st = {i: 0, log: [], good: 0, pending: true, lastScene: ''};
  pushPage(name + ' 롤플레이', (el, page) => {
    el.innerHTML = `<div class="large" style="font-size:28px">${esc(name)}</div><p class="subtitle">점원 말을 듣고 대답을 골라. 고른 다음엔 소리 내서 따라 해.</p><div class="chat"></div><div class="choices"></div>`;
    const chat = $('.chat', el), ch = $('.choices', el);
    st.log.forEach(h => chat.insertAdjacentHTML('beforeend', h));
    step();
    function add(h) { st.log.push(h); chat.insertAdjacentHTML('beforeend', h); requestAnimationFrame(() => page.el.scrollTo({top: page.el.scrollHeight, behavior: reduceMotion() ? 'auto' : 'smooth'})); }
    function step() {
      if (st.i >= steps.length) {
        ch.innerHTML = `<div class="fb good"><b>끝!</b> 자연스러운 대답 ${st.good} / ${steps.length}</div><div class="rate"><button class="btn grey" data-again>다시</button><button class="btn" data-act="back">완료</button></div>`;
        $('[data-again]', ch).addEventListener('click', () => { st.i = 0; st.log = []; st.good = 0; page.render(); });
        return;
      }
      const s = steps[st.i];
      if (!s._shown) {
        if (s.scene && s.scene !== st.lastScene) { add(`<div class="sysmsg"><b>${esc(s.scene)}</b></div>`); st.lastScene = s.scene; }
        if (s.s) { add(`<div class="bub them" lang="ja" data-act="say" data-t="${esc(s.s)}">${esc(s.s)}<span class="tr" data-tr="${st.i}" lang="ko">탭해서 다시 듣기</span></div>`); speak(s.s); }
        else add(`<div class="sysmsg">${esc(s.ko)}</div>`);
        s._shown = true;
      }
      ch.innerHTML = s.o.map((o, j) => `<button class="choice" data-o="${j}"><span lang="ja">${esc(o[0])}</span>${o[1] ? `<small>${esc(o[1])}</small>` : ''}</button>`).join('');
      $$('[data-o]', ch).forEach(b => b.addEventListener('click', () => {
        const o = s.o[+b.dataset.o];
        if (s.s) { const tr = chat.querySelector(`[data-tr="${st.i}"]`); if (tr) tr.textContent = s.ko; st.log = st.log.map(h => h.includes(`data-tr="${st.i}"`) ? h.replace('탭해서 다시 듣기', esc(s.ko)) : h); }
        add(`<div class="bub me" lang="ja">${esc(o[0])}${o[1] ? `<span class="tr" lang="ko">${esc(o[1])}</span>` : ''}</div>`);
        if (!o[0].startsWith('(')) speak(o[0]);
        add(`<div class="fb ${o[2] === 'g' ? 'good' : o[2] === 'o' ? 'ok' : 'bad'}">${o[2] === 'g' ? '자연스러워. ' : o[2] === 'o' ? '통하긴 해. ' : '이건 아니야. '}${esc(o[3])}</div>`);

  });

}

        <button class="btn sm" data-play style="min-height:56px;border-radius:28px;padding:0 26px">${IC.spk} 듣기</button>
        <div class="hstack"><button class="pill" data-slow>천천히</button></div>
        ${st.checked ? `<div class="ans ${st.lastOk ? 'ok-t' : 'no-t'}" lang="ja">${esc(q.show)}</div><div class="hg" lang="ja">${esc(q.k)}</div>` : ''}
      </div>
      <div class="mt16 hstack" style="flex-wrap:nowrap">
        <input class="field" id="numIn" inputmode="${q.time ? 'text' : 'numeric'}" autocomplete="off" placeholder="${q.time ? '예: 7:30' : '들은 숫자'}" ${st.checked ? 'disabled' : ''}>
        ${st.checked ? '' : '<button class="btn" data-check style="width:auto">확인</button>'}
      </div>
      ${st.checked ? '<button class="btn mt12" data-next>다음</button>' : ''}

    const inp = $('#numIn', el);
    if (!st.checked) { setTimeout(() => speak(q.k), 150); }

    const check = () => {
      const raw = inp.value.trim(); if (!raw) return;
      let ok;
      if (q.time) {
        const d = raw.replace(/[^\d:]/g, ' ').trim(); let h, m;
        if (d.includes(':')) [h, m] = d.split(':').map(x => parseInt(x || '0', 10));
        else { const g = d.replace(/\s/g, ''); if (g.length <= 2) { h = +g; m = 0; } else { h = +g.slice(0, -2); m = +g.slice(-2); } }
        const [qh, qm] = q.v.split(':').map(Number); ok = h === qh && (m || 0) === qm;
      } else ok = raw.replace(/\D/g, '') === q.v;
      st.checked = true; st.lastOk = ok; if (ok) { st.ok++; haptic(); } else st.misses.push({show: q.show, k: q.k, mine: raw});

    };
    if (inp && !st.checked) { inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); }); $('[data-check]', el).addEventListener('click', check); }
    const nx = $('[data-next]', el);
    if (nx) nx.addEventListener('click', () => { st.i++; if (st.i >= count) { st.done = true; if (cfg.onDone) cfg.onDone({ok: st.ok, total: count}); } else newQ(); page.render(); });
  });
  return page;
}

/* ---------- minimal pairs ---------- */
function runPairs(filter) {
  const pool = PAIRS.filter(p => !filter || p[4] === filter);
  const items = shuffle(pool.concat(pool)).slice(0, 12).map(p => {
    const first = Math.random() < .5;
    const ans = first ? p[0] : p[2];
    return {q: `<div class="ctx">${esc(p[4])} · 어느 쪽이 들렸어?</div>`, audio: ans, opts: shuffle([{h: `<span lang="ja">${p[0]}</span><br><span class="tiny">${esc(p[1])}</span>`, v: p[0]}, {h: `<span lang="ja">${p[2]}</span><br><span class="tiny">${esc(p[3])}</span>`, v: p[2]}]), ans, label: `<span lang="ja">${ans}</span>`, ansLabel: ans === p[0] ? p[1] : p[3]};
  });
  runQuiz({title: '발음 구별' + (filter ? ' · ' + filter : ''), items});
}

/* ---------- set timer & check-in ---------- */
const SET_NAME = {1: '세트 1 · 교재', 2: '세트 2 · 듣기·말하기', 3: '세트 3 · 복습'};
const SET_COL = {1: 'var(--ring1)', 2: 'var(--ring2)', 3: 'var(--ring3)'};
function runRemaining() {
  const r = S.run; if (!r) return 0;
  const now = Date.now();
  return r.dur - (now - r.start - r.pausedMs - (r.paused ? now - r.paused : 0));
}
function startRun(date, set, mins = 20) {
  S.run = {date, set, start: Date.now(), dur: mins * 60000, paused: null, pausedMs: 0};
  save(); openFocus();
}
const mmss = ms => { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
let focusTimer = null;
function openFocus() {
  if (!S.run) return;
  const existing = PAGES.find(p => p.opt.focus); if (existing) return;
  const page = pushPage(SET_NAME[S.run.set], el => {
    const r = S.run; if (!r) { el.innerHTML = '<div class="empty-state">타이머가 끝났어</div>'; return; }
    const d = dayOf(r.date), C = 2 * Math.PI * 108;
    el.innerHTML = `
      <div class="large" style="font-size:28px">${SET_NAME[r.set]}</div>
      <p class="subtitle">${fmtDate(r.date)}${d ? ' · ' + esc(d.t) : ''}</p>
      <div class="timer"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="108" stroke="var(--fill)" stroke-width="14" fill="none"/><circle class="arc" cx="120" cy="120" r="108" stroke="${SET_COL[r.set]}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
      <div class="tt"><b class="tl">${mmss(runRemaining())}</b><span>${r.paused ? '일시정지' : '남음'}</span></div></div>
      <div class="rate mt8"><button class="btn grey" data-pause>${r.paused ? IC.play + ' 계속' : IC.pause + ' 일시정지'}</button><button class="btn soft" data-end>끝내기</button></div>
      <p class="sh">이 세트에서 할 것</p><div class="list">${setActivities(r.date, r.set).map(rowHTML).join('')}</div>
      <p class="sf">타이머는 화면을 나가도 계속 간다. 위쪽 알약을 누르면 돌아올 수 있어.</p>`;
    const arc = $('.arc', el), tl = $('.tl', el);
    const tick = () => {
      if (!S.run) return;
      const rem = runRemaining();
      tl.textContent = mmss(rem);
      arc.setAttribute('stroke-dashoffset', String(C * (1 - clamp(rem / S.run.dur, 0, 1))));
    };
    tick(); clearInterval(focusTimer); focusTimer = setInterval(tick, 500);
    $('[data-pause]', el).addEventListener('click', () => {
      const r2 = S.run; if (!r2) return;
      if (r2.paused) { r2.pausedMs += Date.now() - r2.paused; r2.paused = null; } else r2.paused = Date.now();
      save(); page.render();
    });
    $('[data-end]', el).addEventListener('click', () => finishRun(false));
  }, {focus: true});
  page.onClose = () => clearInterval(focusTimer);
}
function finishRun(byTimer) {
  const r = S.run; if (!r) return;
  const used = Math.round(Math.min(r.dur, r.dur - runRemaining()) / 60000);
  S.run = null; save();
  const fp = PAGES.find(p => p.opt.focus);
  if (fp) { const idx = PAGES.indexOf(fp); while (PAGES.length > idx) popPage(); }
  if (byTimer) { haptic(); toast(`${SET_NAME[r.set].split(' · ')[0]} 20분 끝!`); }
  updateLive();
  setTimeout(() => checkIn(r.date, r.set, used), 200);
}
let liveTimer = null;
function updateLive() {
  let el = $('.live');
  const show = S.run && !PAGES.some(p => p.opt.focus);
  if (!show) { if (el) el.remove(); }
  else {
    if (!el) { el = document.createElement('div'); el.className = 'live'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.innerHTML = `<span class="ld" style="background:${SET_COL[S.run.set]}"></span><span>세트 ${S.run.set}</span><span class="lt">${mmss(runRemaining())}</span><button data-act="openFocus">열기</button>`;
  }
}
function globalTick() {
  if (S.run && !S.run.paused && runRemaining() <= 0) { finishRun(true); return; }
  const lt = $('.live .lt'); if (lt && S.run) lt.textContent = mmss(runRemaining());
}

/* ---------- weekly tests ---------- */
function runTest(w) {
  const finish = (score, pass, detail) => { S.tests[w] = {score, pass, at: Date.now(), detail}; save(); render(); };
  if (w === 1) {
    runQuiz({title: '1주차 테스트', items: kanaQuizItems(HIRA_ALL, 'read'), timed: 2000, noRetry: false,
      passText: r => (r.ok / r.total >= .95 && r.avg <= 2000) ? '<b class="ok-t">통과!</b> 2주차로 가자' : '<b class="no-t">아직</b> 기준: 정답 95%, 평균 2초 이하. 틀린 글자는 카드로 다시 나와',
      onDone: r => finish(Math.round(r.ok / r.total * 100), r.ok / r.total >= .95 && r.avg <= 2000, `평균 ${(r.avg / 1000).toFixed(2)}초`)});
    return;
  }
  if (w === 2) {
    runFlash({title: '2주차 테스트 ① 단어 읽기', items: pick(W2WORDS, 30).map(x => ({kind: '소리 내서 읽기', front: `<div class="front ja" lang="ja">${x}</div>`, back: `<div class="hg">${esc(toHangul(x))}</div>`, audio: x})),
      onDone: a => {
        setTimeout(() => { popPage(); runQuiz({title: '2주차 테스트 ② 메뉴', items: shuffle(MENU).map(m => ({q: `<div class="front ja" lang="ja">${m[0]}</div>`, after: m[0], opts: shuffle([m, ...pick(MENU.filter(x => x !== m), 3)]).map(x => ({h: esc(x[1]), v: x[0]})), ans: m[0], label: `<span lang="ja">${m[0]}</span>`, ansLabel: m[1]})),
          onDone: b => { const sc = Math.round((a.ok + a.slow + b.ok) / (30 + MENU.length) * 100); finish(sc, sc >= 80, `읽기 ${a.ok + a.slow}/30 · 메뉴 ${b.ok}/${MENU.length}`); toast(sc >= 80 ? '2주차 통과!' : '아직이야. 기준은 80%'); }}); }, 400);
      }});
    return;
  }
  const upto = w === 6 ? DAYS.length : DAYS.findIndex(d => d.test === w);
  const learned = [...new Set(DAYS.slice(0, upto).flatMap(d => (d.s2 && d.s2.ph) || []))].filter(id => PH_BY[id].w !== 'staff');
  const listen = [...new Set(DAYS.slice(0, upto).flatMap(d => (d.s2 && d.s2.ph) || []))].filter(id => PH_BY[id].w === 'staff');
  const nPh = w === 6 ? 20 : 15;
  const items = pick(learned, nPh).map(id => cardItem('p:' + id)).concat(pick(listen, w === 6 ? 6 : 4).map(id => cardItem('p:' + id)));
  const lv = {3: [3], 4: [4, 5], 5: [6, 7], 6: [3, 4, 5, 6, 7]}[w];
  runFlash({title: `${w}주차 테스트 ① 말하기·듣기`, items: shuffle(items), onDone: a => {
    setTimeout(() => { popPage(); runNumbers({title: `${w}주차 테스트 ② 숫자`, levels: lv, count: 10, onDone: b => {
      const sp = (a.ok + a.slow) / a.total, nu = b.ok / b.total;
      const sc = Math.round((sp * .6 + nu * .4) * 100);
      const pass = sp >= .8 && nu >= (w === 5 ? .9 : .8);
      finish(sc, pass, `말하기 ${a.ok + a.slow}/${a.total} · 숫자 ${b.ok}/${b.total}`);
      toast(pass ? `${w}주차 통과!` : '아직이야. 틀린 건 카드로 다시 나와');
    }}); }, 400);
  }});
}

function ringsSVG(vals) {

  return `<svg viewBox="0 0 132 132" role="img" aria-label="세 세트 진행률">${R.map((r, k) => {
    const c = 2 * Math.PI * r, v = clamp(vals[k], 0, 1);
    return `<circle cx="66" cy="66" r="${r}" fill="none" stroke="${C[k]}" stroke-opacity=".2" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="${C[k]}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v)}" ${v === 0 ? 'stroke-opacity="0"' : ''}/>`;
  }).join('')}</svg>`;
}
const stVal = s => s === 'done' ? 1 : s === 'part' ? .5 : 0;
const stLabel = s => s === 'done' ? '<span class="status done">완료</span>' : s === 'part' ? '<span class="status part">반만</span>' : s === 'skip' ? '<span class="status skip">못 함</span>' : '<span class="status wait">대기</span>';
const minsOf = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
function streak() {

  if (!any(d)) d = addDays(d, -1);

}

function banners(sel, t) {

function speakAsync(text, opt = {}) {
  return new Promise(res => {
    const t = ttsText(text);
    const est = 600 + t.length * 260 / (opt.rate || S.settings.rate);
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    if ('speechSynthesis' in window && (JA || !CTTS)) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = opt.rate || S.settings.rate; if (JA) u.voice = JA;
        u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
        setTimeout(fin, est + 4000); return;
      } catch (e) {}
    }
    if (CTTS) { CTTS.speak(t, {language: 'ja', rate: clamp(opt.rate || S.settings.rate, .7, 1.5)}).then(fin, fin); setTimeout(fin, est + 6000); return; }
    setTimeout(fin, est);
  });
}
function pShadow(list, title) {
  const st = {j: 0, playing: false, run: 0, rep: 2};
  const page = pushPage('쉐도잉', el => {
    const p = list[st.j];
    el.innerHTML = `<h1 class="large">쉐도잉</h1><p class="subtitle">${esc(title)} · 듣고 바로 겹쳐서 따라 말하기</p>
      <div class="flash"><span class="kind">${st.j + 1} / ${list.length}</span><div class="front ja" lang="ja">${esc(clean(p.k))}</div>${hangulMode() !== 'hide' ? `<div class="hg">${esc(toHangul(p.k))}</div>` : ''}<div class="ctx">${esc(p.ko)}</div><div class="sstate tiny"></div></div>
      <div class="hstack mt16" style="justify-content:center"><span class="tiny">반복</span><div class="seg" style="width:160px">${[1, 2, 3].map(n => `<button class="${st.rep === n ? 'on' : ''}" data-rep="${n}">${n}번</button>`).join('')}</div></div>
      <div class="rate mt16"><button class="btn grey" data-prev>이전</button><button class="btn grey" data-nx>다음</button></div>
      <button class="btn mt12" data-play>${st.playing ? IC.pause + ' 멈추기' : IC.play + ' 자동 재생'}</button>`;
    $$('[data-rep]', el).forEach(b => b.addEventListener('click', () => { st.rep = +b.dataset.rep; page.render(); }));
    $('[data-prev]', el).addEventListener('click', () => { st.j = (st.j - 1 + list.length) % list.length; stop(); page.render(); speak(list[st.j].k); });
    $('[data-nx]', el).addEventListener('click', () => { st.j = (st.j + 1) % list.length; stop(); page.render(); speak(list[st.j].k); });
    $('[data-play]', el).addEventListener('click', () => { if (st.playing) { stop(); page.render(); } else { st.playing = true; page.render(); loop(++st.run); } });
  });
  function stop() { st.playing = false; st.run++; try { speechSynthesis.cancel(); } catch (e) {} }
  async function loop(run) {
    while (st.playing && run === st.run) {
      const p = list[st.j];
      for (let r = 0; r < st.rep && st.playing && run === st.run; r++) {
        const s = $('.sstate', page.el); if (s) s.textContent = '듣기';
        await speakAsync(p.k);
        if (!st.playing || run !== st.run) return;
        const s2 = $('.sstate', page.el); if (s2) s2.textContent = '지금 따라 말해!';
        await new Promise(r2 => setTimeout(r2, 900 + clean(p.k).length * 220));
      }
      if (!st.playing || run !== st.run) return;
      st.j = (st.j + 1) % list.length; page.render();
    }
  }
  page.onClose = stop;
}

/* ---------- AI (Claude) ---------- */
async function aiJSON(prompt) {
  if (!AI) throw new Error('no ai');
  let v;
  if (typeof AI.json === 'function') { v = await AI.json(prompt); if (v && typeof v === 'object') return v; }
  const r = await AI(prompt);
  const txt = (r && r.text) || '';
  const m = txt.match(/\{[\s\S]*\}/);
  return m ? JSON.parse(m[0]) : null;
}

  review: () => { const due = shuffle(dueCards()); if (!due.length) { toast('오늘 복습할 카드가 없어'); return; } runFlash({title: '카드 복습', items: due.map(cardItem), srs: true, target: 12, onDone: () => render()}); },
  ahead: () => { const ids = Object.keys(S.cards).filter(id => cardExists(id) && S.cards[id].due === addDays(today(), 1)); if (!ids.length) { toast('내일 카드가 없어'); return; } runFlash({title: '미리 복습', items: shuffle(ids).map(cardItem), srs: true}); },
  weak: () => { const ids = Object.keys(S.cards).filter(id => cardExists(id) && (S.cards[id].w >= 2 || (S.cards[id].b === 1 && S.cards[id].n > 0))); if (!ids.length) { toast('자주 틀린 카드가 없어. 좋아'); return; } runFlash({title: '자주 틀린 것', items: shuffle(ids).slice(0, 20).map(cardItem), srs: true}); },
  recall: d => pRecall(d.d || today()),
  memo: () => pMemo(),
  allCards: () => pAllCards(),
  test: d => runTest(+d.w),
  core: () => pCore(),
  depart: () => pDepart(),
  checkItem: d => { S.check[d.j] = !S.check[d.j]; save(); PAGES[PAGES.length - 1].render(); },
  curriculum: () => pCurriculum(),
  pitfalls: () => pPitfalls(),
  casual: d => { S.settings.casual = d.v === '1'; save(); render(); },
  talkRules: () => pTalkRules(),
  slang: d => pSlang(+d.k),
  trends: () => pTrends(),
  aichat: () => pAIChat(),
  translate: () => pTranslate(),
  set: d => { S.settings[d.k] = d.k === 'rate' ? +d.v : d.v; save(); render(); if (d.k === 'rate') speak('こんにちは'); },
  backup: () => { const txt = JSON.stringify(S); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('백업을 복사했어. 메모 앱에 붙여 둬'), () => showBackup(txt)); else showBackup(txt); },
  restore: () => openSheet(b => {
    b.innerHTML = `<h2>백업 복원</h2><p class="muted small">복사해 둔 백업을 붙여넣어. 지금 기록은 덮어써져.</p>${IS_PWA ? '<input type="file" id="rsf" accept="application/json,.json,.txt" class="field mt12">' : ''}<textarea class="field mt12" id="rs" placeholder="백업 붙여넣기"></textarea><button class="btn mt12" data-ok>복원</button>`;
    const rf = $('#rsf', b); if (rf) rf.addEventListener('change', () => { const f = rf.files[0]; if (!f) return; f.text().then(t => { $('#rs', b).value = t; }); });
    $('[data-ok]', b).addEventListener('click', () => { try { const v = JSON.parse($('#rs', b).value); if (!v || typeof v !== 'object' || !v.settings) throw 0; S = Object.assign(DEFAULT_STATE(), v); save(); closeSheet(); render(); toast('복원했어'); } catch (e) { toast('백업 형식이 아니야'); } });
  }),
  reset: () => openSheet(b => {
    b.innerHTML = `<h2>처음부터 다시?</h2><p class="muted small">세트 기록, 카드, 테스트 결과가 전부 지워져. 되돌릴 수 없어.</p><div class="stack mt16"><button class="btn red" data-ok>전부 지우기</button><button class="btn grey" data-no>취소</button></div>`;
    $('[data-ok]', b).addEventListener('click', () => { S = DEFAULT_STATE(); S.asked.welcome = 1; save(); closeSheet(); render(); toast('초기화했어'); });
    $('[data-no]', b).addEventListener('click', () => closeSheet());
  })
};
function showBackup(txt) { openSheet(b => { b.innerHTML = `<h2>백업</h2><p class="muted small">아래 글을 전부 길게 눌러 복사해서 메모에 붙여 둬.</p><textarea class="field mt12" readonly style="min-height:200px;font-size:12px">${esc(txt)}</textarea>`; }); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.tagName === 'A') return;
  const f = ACT[a.dataset.act];
  if (f) { e.preventDefault(); f(a.dataset, a); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.sos')) $('.sos').remove(); else if (SHEET) closeSheet(); else if (PAGES.length) popPage(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== S.tab) { closeAllPages(); S.tab = h; render(); } });

/* ---------- welcome ---------- */
function welcome() {
  if (S.asked.welcome) return;
  openSheet(b => {
    b.innerHTML = `<h2>일본까지 6주</h2><p class="muted">11월 25일부터 1월 6일까지 하루 20분씩 세 번. 교재로 배우고, 듣고 말하고, 자기 전에 복습해.</p>
      <p class="sh" style="margin-left:0">세트 시간 정하기</p><div class="list">${[1, 2, 3].map(n => `<div class="row"><span class="dot" style="background:${SET_COL[n]}"></span><span class="t"><b>${SET_NAME[n]}</b></span><input type="time" class="field" style="width:148px;min-height:36px;padding:4px 8px;font-size:16px" data-wt="${n - 1}" value="${S.settings.times[n - 1]}"></div>`).join('')}</div>
      <p class="sf">세트 사이는 3시간 이상. 시간이 지나면 했는지 물어보고, 못 했으면 이유를 캐물을 거야.${IS_PWA ? ' 정한 다음 나 탭에서 폰 캘린더 알림도 넣어 둬.' : ''}</p>
      <button class="btn mt16" data-go>시작하기</button>`;
    $('[data-go]', b).addEventListener('click', () => { $$('[data-wt]', b).forEach(i => { if (i.value) S.settings.times[+i.dataset.wt] = i.value; }); S.asked.welcome = 1; save(); closeSheet(); render(); });
  }, {sticky: true});
}


/* ================= INSTALLED APP (PWA) ================= */
let INSTALL_EVT = null;
function isStandalone() {
  try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; }
}
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installBanner() {
  if (!IS_PWA || isStandalone() || S.asked.install) return '';
  const ios = isIOS();
  return `<div class="banner blue mt16"><div class="grow"><b>홈 화면에 설치하면 진짜 앱처럼 써</b>
    <p>${ios ? 'Safari 아래쪽 공유 버튼 → "홈 화면에 추가" → 추가. 그다음부터는 꼭 홈 화면 아이콘으로 열어. Safari에서 연 기록과 아이콘으로 연 기록은 따로 저장돼.' : INSTALL_EVT ? '아래 버튼을 누르면 바로 설치돼.' : '브라우저 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가".'}</p>
    <div class="hstack mt12">${!ios && INSTALL_EVT ? '<button class="btn sm" data-act="install">설치하기</button>' : ''}<button class="btn sm grey" data-act="hideInstall">나중에</button></div></div></div>`;
}
function downloadFile(name, text, type) {
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function icsFold(line) {
  const out = []; let cur = '', bytes = 0;
  for (const ch of line) {
    const b = new TextEncoder().encode(ch).length;
    if (bytes + b > 73) { out.push(cur); cur = ' ' + ch; bytes = 1 + b; } else { cur += ch; bytes += b; }
  }
  out.push(cur);
  return out.join('\r\n');
}
function setDesc(i, n) {
  const d = DAYS[i];
  if (d.test) return n === 1 ? `${d.test === 6 ? '최종' : d.test + '주차'} 테스트` : n === 2 ? (d.talk ? '하루토랑 대화' : '발음 구별 연습') : '카드 복습 + 보지 않고 적기';
  if (d.last) return n === 1 ? '핵심 30문장' : n === 2 ? '출국 체크리스트' : '카드 복습';
  if (n === 1) return (d.s1 && d.s1.txt) || d.t;
  if (n === 2) return d.s2 && d.s2.ph ? '표현: ' + d.s2.ph.map(id => PH_BY[id].ko).join(' / ') : d.s2 && d.s2.rp ? '롤플레이' : '듣기·말하기';
  return '카드 복습 12분 + 보지 않고 적기 5분 + 틀린 것 3분';
}
function makeICS(times) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//nihongo6//KO', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:일본어 6주', 'X-WR-TIMEZONE:Asia/Seoul',
    'BEGIN:VTIMEZONE', 'TZID:Asia/Seoul', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0900', 'TZOFFSETTO:+0900', 'TZNAME:KST', 'END:STANDARD', 'END:VTIMEZONE'];
  DAYS.forEach((d, i) => {
    const date = dateOfIdx(i).replace(/-/g, '');
    [1, 2, 3].forEach(n => {
      const [hh, mm] = times[n - 1].split(':').map(Number);
      const end = hh * 60 + mm + 20;
      const st = `${date}T${pad(hh)}${pad(mm)}00`;
      const enDate = end >= 1440 ? addDays(dateOfIdx(i), 1).replace(/-/g, '') : date;
      const en = `${enDate}T${pad(Math.floor(end % 1440 / 60))}${pad(end % 60)}00`;
      const title = `일본어 ${SET_NAME[n]} (Day ${i + 1})`;
      L.push('BEGIN:VEVENT', `UID:nihongo6-${date}-${n}@nihongo6`, `DTSTAMP:${stamp}`, `DTSTART;TZID=Asia/Seoul:${st}`, `DTEND;TZID=Asia/Seoul:${en}`,
        icsFold('SUMMARY:' + icsEscape(title)), icsFold('DESCRIPTION:' + icsEscape(setDesc(i, n) + '\n앱에서 시작 → 20분 타이머')),
        'BEGIN:VALARM', 'ACTION:DISPLAY', icsFold('DESCRIPTION:' + icsEscape(`${SET_NAME[n]} 시간. 20분만!`)), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    });
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
Object.assign(ACT, {
  install: async () => {
    if (!INSTALL_EVT) return;
    INSTALL_EVT.prompt();
    try { const r = await INSTALL_EVT.userChoice; if (r && r.outcome === 'accepted') { S.asked.install = 1; save(); } } catch (e) {}
    INSTALL_EVT = null; render();
  },
  hideInstall: () => { S.asked.install = 1; save(); render(); },
  ics: () => {
    downloadFile('nihongo6-alarms.ics', makeICS(S.settings.times), 'text/calendar');
    openSheet(b => {
      b.innerHTML = `<h2>캘린더 알림 파일</h2><p class="muted small">방금 받은 파일을 열고 "모두 추가"를 누르면 129개 세트 일정이 알림과 함께 들어가.</p>
        <div class="card small mt12"><b>아이폰</b><br>파일이 바로 안 열리면 공유 → "캘린더"로 열거나, 파일 앱에서 nihongo6-alarms.ics를 눌러.</div>
        <div class="card small mt8"><b>안드로이드</b><br>다운로드 알림에서 파일을 열고 Google 캘린더로 가져오기.</div>
        ${S.settings.times.join() === '10:00,16:00,22:30' ? `<a class="btn soft mt12" href="calendar.ics">기본 시간 파일로 열기</a>` : ''}
        <button class="btn mt12" data-ok>확인</button>`;
      $('[data-ok]', b).addEventListener('click', () => closeSheet());
    });
  },
  backupFile: () => { downloadFile(`nihongo6-backup-${today()}.json`, JSON.stringify(S), 'application/json'); toast('백업 파일을 저장했어'); }
});
function initPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL_EVT = e; if (S.tab === 'today' && !PAGES.length) render(); });
  window.addEventListener('appinstalled', () => { S.asked.install = 1; save(); render(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('새 버전이 준비됐어. 앱을 껐다 켜면 적용돼'); });
      });
    }).catch(() => {});
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

/* ---------- boot ---------- */
(function boot() {
  const h = location.hash.slice(1);
  if (TABS.some(t => t[0] === h)) S.tab = h;
  render();
  setInterval(globalTick, 1000);
  setInterval(() => { if (S.tab === 'today' && !PAGES.length && !SHEET) render(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { globalTick(); if (!PAGES.length && !SHEET) render(); } });
  setTimeout(welcome, 400);
  initSync();
  initCaps();
  if (IS_PWA) initPWA();
})();

})();
</script>
</body>
</html>
